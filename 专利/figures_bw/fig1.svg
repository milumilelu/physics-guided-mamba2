  <text x="395" y="262" font-size="22" fill="#000000" text-anchor="middle">2</text>
  <text x="440" y="262" font-size="22" fill="#000000" text-anchor="middle">3</text>
  <text x="485" y="262" font-size="22" fill="#000000" text-anchor="middle">4</text>
  <text x="530" y="262" font-size="22" fill="#000000" text-anchor="middle">5</text>
  <text x="575" y="262" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">n<tspan dy="0" font-size="18">&#8722;</tspan>1</text>
  <text x="620" y="262" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">n</text>

  <!-- Δx 标尺：移到光斑带正下方，y=290，不再穿过光斑 -->
  <line x1="395" y1="290" x2="440" y2="290" stroke="#000000" stroke-width="1.6"/>
  <line x1="395" y1="285" x2="395" y2="295" stroke="#000000" stroke-width="1.6"/>
  <line x1="440" y1="285" x2="440" y2="295" stroke="#000000" stroke-width="1.6"/>
  <text x="417" y="310" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;x</text>

  <!-- 分隔虚线：B-1 与 B-2 -->
  <line x1="320" y1="334" x2="680" y2="334" stroke="#000000" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

  <!-- B-2 时间轴（y=350~420） -->
  <text x="500" y="364" font-size="22" fill="#000000" text-anchor="middle">时间轴：脉冲逐个到达</text>
