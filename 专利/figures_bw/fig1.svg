  <line x1="1263" y1="264" x2="1273" y2="264" stroke="#000000" stroke-width="1.2"/>
  <text x="1336" y="262" font-size="22" fill="#000000" text-anchor="end" font-family="Times New Roman, Times, serif" font-style="italic">d<tspan dy="4" font-size="18">line</tspan></text>

  <line x1="1140" y1="294" x2="1140" y2="306" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="294" x2="1180" y2="306" stroke="#000000" stroke-width="1.2"/>
  <line x1="1140" y1="300" x2="1180" y2="300" stroke="#000000" stroke-width="1.4"/>
  <text x="1190" y="316" font-size="22" fill="#000000" text-anchor="start" font-family="Times New Roman, Times, serif" font-style="italic">w<tspan dy="4" font-size="18">line</tspan></text>

  <text x="1200" y="350" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="4" font-size="18">line</tspan> = [ w<tspan dy="4" font-size="18">line</tspan>, d<tspan dy="4" font-size="18">line</tspan> ]</text>

  <!-- D-下：矩形槽加工（y=380~580） -->
