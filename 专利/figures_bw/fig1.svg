  <line x1="430" y1="405" x2="430" y2="415" stroke="#000000" stroke-width="1.6"/>
  <line x1="500" y1="405" x2="500" y2="415" stroke="#000000" stroke-width="1.6"/>
  <text x="465" y="430" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;t</text>

  <!-- 分隔虚线：B-2 与 B-3 -->
  <line x1="320" y1="450" x2="680" y2="450" stroke="#000000" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

  <!-- B-3 三张等尺寸卡片（y=472, h=120；卡宽 112 等分，卡间 12px 箭头带；标题统一 4 字，波形谷底与标签留 12px+）-->
  <rect x="320" y="472" width="112" height="120" rx="6" fill="none" stroke="#000000" stroke-width="1.8"/>
