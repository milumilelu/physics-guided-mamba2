<!-- BLACK-AND-WHITE VERSION: derived by figures/fig_bw_convert.py; for CNIPA paper-filing -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="none"/>

  <text x="700" y="60" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle">多脉冲扫描加工过程与宏观形貌形成</text>

  <!-- ============ A 工艺输入（与 B/C/D 等顶齐 y=80）============ -->
  <rect x="40" y="80" width="240" height="180" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="160" y="118" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">激光与扫描参数</text>
  <text x="160" y="160" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">P, f, &#964;<tspan dy="5" font-size="20">p</tspan></text>
  <text x="160" y="194" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">v, h, N<tspan dy="5" font-size="20">pass</tspan></text>
  <text x="160" y="232" font-size="26" fill="#000000" text-anchor="middle">材料及扫描轨迹</text>

  <line x1="160" y1="260" x2="160" y2="288" stroke="#000000" stroke-width="2"/>
  <polygon points="160,296 154,284 166,284" fill="#000000"/>

  <rect x="40" y="304" width="240" height="296" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="160" y="342" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">脉冲级作用条件</text>
  <text x="160" y="394" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">E<tspan dy="5" font-size="20">p</tspan> = P/f</text>
  <text x="160" y="438" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;t = 1/f</text>
  <text x="160" y="482" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;x = v/f</text>
  <text x="160" y="544" font-size="22" fill="#000000" text-anchor="middle">局部作用、帧内固化</text>

  <!-- A→B：A 框右侧视觉中心 y=420 引出到 B 框 -->
  <line x1="280" y1="452" x2="292" y2="452" stroke="#000000" stroke-width="2.4"/>
  <polygon points="300,452 288,446.5 288,457.5" fill="#000000"/>

  <!-- ============ B 单扫描线脉冲作用（蓝，视觉中心，纵向三段式重排）============ -->
  <!-- 外框拉高到 h=520 给三段各自独立区段；底部 y=600 留出空间与 D 区底沿 510 错位对齐 -->
  <rect x="300" y="80" width="400" height="520" rx="10" fill="none" stroke="#000000" stroke-width="2.8"/>
  <text x="500" y="114" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">单扫描线上的脉冲作用</text>

  <!-- B-1 重叠光斑带（y=140~280） -->
  <text x="500" y="144" font-size="24" fill="#000000" text-anchor="middle">重叠光斑（高斯能量分布）</text>
  <!-- 扫描方向：移到 Δx 标尺同行的右侧空白带，箭头朝右，不再压光斑、不再被虚线穿字 -->
  <text x="520" y="310" font-size="22" fill="#000000" text-anchor="start">扫描方向</text>
  <line x1="616" y1="304" x2="664" y2="304" stroke="#000000" stroke-width="1.6" stroke-dasharray="5 3"/>
  <polygon points="672,304 660,299 660,309" fill="#000000"/>

  <circle cx="350" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="395" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="440" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="485" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="530" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="575" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="620" cy="222" r="20" fill="none" stroke="#000000" stroke-width="2"/>
