  <line x1="1244" y1="466" x2="1254" y2="466" stroke="#000000" stroke-width="1.2"/>
  <text x="1336" y="464" font-size="22" fill="#000000" text-anchor="end" font-family="Times New Roman, Times, serif" font-style="italic">d<tspan dy="4" font-size="18">groove</tspan></text>

  <text x="1200" y="518" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="4" font-size="18">groove</tspan> = [ d<tspan dy="4" font-size="18">groove</tspan>,</text>
  <text x="1200" y="546" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">S<tspan dy="4" font-size="18">a</tspan>, S<tspan dy="4" font-size="18">q</tspan>, S<tspan dy="4" font-size="18">z</tspan> ]</text>

