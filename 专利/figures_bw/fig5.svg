<!-- BLACK-AND-WHITE VERSION: derived by figures/fig_bw_convert.py; for CNIPA paper-filing -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="none"/>

  <text x="700" y="60" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle">单脉冲内部计算流程</text>

  <!-- 列标签 -->
  <text x="160" y="108" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">当前状态 / 输入</text>
  <text x="490" y="108" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">门控</text>
  <text x="750" y="108" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">去除子模型</text>
  <text x="990" y="108" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">加权组合</text>
  <text x="1230" y="108" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">下一状态</text>

  <!-- ============ 第 1 列：三个输入（严格同宽同高 240×130）============ -->
  <rect x="40" y="150" width="240" height="130" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="40" y="146" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">1</text>
  <text x="160" y="196" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">当前表面形貌</text>
  <text x="160" y="250" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="5" font-size="22">n</tspan></text>

  <rect x="40" y="355" width="240" height="130" rx="8" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="40" y="351" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">2</text>
  <text x="160" y="401" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">当前历史材料状态</text>
  <text x="160" y="455" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Z<tspan dy="5" font-size="22">n</tspan></text>

  <rect x="40" y="560" width="240" height="130" rx="8" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="40" y="556" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">3</text>
  <text x="160" y="606" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">当前激光作用条件</text>
  <text x="160" y="660" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">u<tspan dy="5" font-size="22">n</tspan></text>

  <!-- 第1列 → 门控（统一目标 x=370） -->
  <line x1="280" y1="215" x2="302" y2="215" stroke="#000000" stroke-width="2.2"/>
  <line x1="302" y1="215" x2="302" y2="350" stroke="#000000" stroke-width="2.2"/>
  <line x1="302" y1="350" x2="312" y2="350" stroke="#000000" stroke-width="2.2"/>
  <polygon points="320,350 308,344 308,356" fill="#000000"/>

  <line x1="280" y1="420" x2="362" y2="420" stroke="#000000" stroke-width="2.2"/>
  <polygon points="370,420 358,414 358,426" fill="#000000"/>

  <line x1="280" y1="625" x2="302" y2="625" stroke="#000000" stroke-width="2.2"/>
  <line x1="302" y1="625" x2="302" y2="490" stroke="#000000" stroke-width="2.2"/>
  <line x1="302" y1="490" x2="362" y2="490" stroke="#000000" stroke-width="2.2"/>
  <polygon points="370,490 358,484 358,496" fill="#000000"/>

  <!-- ============ 第 2 列：门控（加宽到 360）============ -->
  <rect x="370" y="270" width="360" height="300" rx="10" fill="none" stroke="#000000" stroke-width="2.8"/>
  <text x="550" y="316" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">材料去除状态门控</text>
  <line x1="398" y1="334" x2="702" y2="334" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>

  <text x="550" y="386" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> = G</tspan><tspan dy="5" font-size="20">&#952;</tspan><tspan dy="-5"> ( H</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, Z</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, u</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> )</tspan></text>

  <line x1="398" y1="410" x2="702" y2="410" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>

  <text x="550" y="460" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="5" font-size="20">m,n</tspan><tspan dy="-5"> &#8805; 0</tspan></text>
  <text x="550" y="510" font-size="26" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#8721;<tspan dy="5" font-size="20">m</tspan><tspan dy="-5"> &#960;</tspan><tspan dy="5" font-size="20">m,n</tspan><tspan dy="-5"> = 1</tspan></text>
  <text x="550" y="552" font-size="24" fill="#000000" text-anchor="middle">权重由历史状态共同决定</text>

  <!-- 门控 → 子模型 -->
  <line x1="730" y1="350" x2="746" y2="350" stroke="#000000" stroke-width="2.2"/>
  <line x1="746" y1="350" x2="746" y2="305" stroke="#000000" stroke-width="2.2"/>
  <line x1="746" y1="305" x2="752" y2="305" stroke="#000000" stroke-width="2.2"/>
  <polygon points="760,305 748,299 748,311" fill="#000000"/>

  <line x1="730" y1="420" x2="752" y2="420" stroke="#000000" stroke-width="2.2"/>
  <polygon points="760,420 748,414 748,426" fill="#000000"/>

  <line x1="730" y1="490" x2="746" y2="490" stroke="#000000" stroke-width="2.2"/>
  <line x1="746" y1="490" x2="746" y2="535" stroke="#000000" stroke-width="2.2"/>
  <line x1="746" y1="535" x2="752" y2="535" stroke="#000000" stroke-width="2.2"/>
  <polygon points="760,535 748,529 748,541" fill="#000000"/>

  <!-- ============ 第 3 列：子模型（等尺寸 120×90）============ -->
  <rect x="760" y="260" width="120" height="90" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="820" y="320" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="5" font-size="22">1</tspan></text>

  <rect x="760" y="375" width="120" height="90" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="820" y="435" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="5" font-size="22">2</tspan></text>

  <rect x="760" y="490" width="120" height="90" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="820" y="550" font-size="32" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="5" font-size="22">M</tspan></text>

  <line x1="820" y1="356" x2="820" y2="369" stroke="#000000" stroke-width="2" stroke-dasharray="3 4"/>
  <line x1="820" y1="471" x2="820" y2="484" stroke="#000000" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- 子模型 → 加权组合 -->
  <line x1="880" y1="305" x2="915" y2="305" stroke="#000000" stroke-width="2.2"/>
  <line x1="915" y1="305" x2="915" y2="350" stroke="#000000" stroke-width="2.2"/>
  <line x1="915" y1="350" x2="942" y2="350" stroke="#000000" stroke-width="2.2"/>
  <polygon points="950,350 938,344 938,356" fill="#000000"/>
  <text x="915" y="296" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="5" font-size="18">1,n</tspan></text>

  <line x1="880" y1="420" x2="942" y2="420" stroke="#000000" stroke-width="2.2"/>
  <polygon points="950,420 938,414 938,426" fill="#000000"/>
  <text x="915" y="411" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="5" font-size="18">2,n</tspan></text>

  <line x1="880" y1="535" x2="915" y2="535" stroke="#000000" stroke-width="2.2"/>
  <line x1="915" y1="535" x2="915" y2="490" stroke="#000000" stroke-width="2.2"/>
  <line x1="915" y1="490" x2="942" y2="490" stroke="#000000" stroke-width="2.2"/>
  <polygon points="950,490 938,484 938,496" fill="#000000"/>
  <text x="915" y="526" font-size="22" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="5" font-size="18">M,n</tspan></text>

  <!-- ============ 第 4 列：加权组合（窄：1 主公式 + 1 说明）============ -->
  <rect x="950" y="310" width="100" height="220" rx="10" fill="none" stroke="#000000" stroke-width="2.4"/>
  <text x="1000" y="346" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">加权</text>
  <text x="1000" y="376" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">组合</text>
  <line x1="966" y1="392" x2="1034" y2="392" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>

  <text x="1000" y="430" font-size="24" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;H<tspan dy="4" font-size="18">n</tspan></text>
  <text x="1000" y="464" font-size="20" fill="#000000" text-anchor="middle">子模型</text>
  <text x="1000" y="490" font-size="20" fill="#000000" text-anchor="middle">加权求和</text>
  <line x1="966" y1="504" x2="1034" y2="504" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="1000" y="520" font-size="18" fill="#000000" text-anchor="middle">详细公式→</text>

  <!-- ============ 第 5 列：双状态同步更新（独占右半，公式 2 行）============ -->
  <rect x="1060" y="280" width="300" height="280" rx="10" fill="none" stroke="#000000" stroke-width="2.8"/>
  <text x="1210" y="312" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">加权公式  ·  双状态同步更新</text>
  <line x1="1086" y1="334" x2="1334" y2="334" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>

  <text x="1210" y="378" font-size="24" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;H<tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> = &#8721;</tspan><tspan dy="5" font-size="20">m</tspan><tspan dy="-5"> &#960;</tspan><tspan dy="5" font-size="20">m,n</tspan><tspan dy="-5"> A</tspan><tspan dy="5" font-size="20">m</tspan></text>
  <text x="1210" y="416" font-size="24" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="5" font-size="20">m</tspan><tspan dy="-5"> = A</tspan><tspan dy="5" font-size="20">m</tspan><tspan dy="-5"> ( H</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, Z</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, u</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> )</tspan></text>

  <line x1="1086" y1="442" x2="1334" y2="442" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>

  <text x="1210" y="482" font-size="24" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="5" font-size="20">n+1</tspan><tspan dy="-5"> = U ( H</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, &#916;H</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> )</tspan></text>
  <text x="1210" y="520" font-size="24" fill="#000000" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Z<tspan dy="5" font-size="20">n+1</tspan><tspan dy="-5"> = S</tspan><tspan dy="5" font-size="20">&#952;</tspan><tspan dy="-5"> ( Z</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, H</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, u</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, &#916;t</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5"> )</tspan></text>

  <line x1="1086" y1="546" x2="1334" y2="546" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="1210" y="556" font-size="0" fill="transparent">占位</text>

</svg>
