  <text x="870" y="192" font-size="26" fill="#633806" text-anchor="middle">平行扫描线（线间距 h）</text>

  <line x1="760" y1="214" x2="980" y2="214" stroke="#185FA5" stroke-width="1.8"/>
  <polygon points="988,214 976,208.5 976,219.5" fill="#185FA5"/>
  <line x1="760" y1="234" x2="980" y2="234" stroke="#185FA5" stroke-width="1.8"/>
  <polygon points="988,234 976,228.5 976,239.5" fill="#185FA5"/>
  <line x1="760" y1="254" x2="980" y2="254" stroke="#185FA5" stroke-width="1.8"/>
  <polygon points="988,254 976,248.5 976,259.5" fill="#185FA5"/>
  <line x1="760" y1="274" x2="980" y2="274" stroke="#185FA5" stroke-width="1.8"/>
  <polygon points="988,274 976,268.5 976,279.5" fill="#185FA5"/>

  <!-- h 标尺 -->
  <line x1="732" y1="214" x2="732" y2="254" stroke="#BA7517" stroke-width="1.6"/>
  <line x1="727" y1="214" x2="737" y2="214" stroke="#BA7517" stroke-width="1.6"/>
  <line x1="727" y1="254" x2="737" y2="254" stroke="#BA7517" stroke-width="1.6"/>
  <text x="740" y="238" font-size="22" fill="#BA7517" text-anchor="start" font-family="Times New Roman, Times, serif" font-style="italic">h</text>

  <!-- C 下部：多遍加工 -->
  <line x1="740" y1="296" x2="1010" y2="296" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1010" y="306" font-size="22" fill="#5F5E5A" text-anchor="end">多遍加工</text>

  <rect x="748" y="318" width="192" height="32" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.5"/>
  <line x1="763" y1="334" x2="925" y2="334" stroke="#185FA5" stroke-width="1.6"/>
  <text x="950" y="340" font-size="22" fill="#633806" text-anchor="start">第1遍</text>

  <rect x="748" y="358" width="192" height="32" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.5"/>
  <line x1="763" y1="374" x2="925" y2="374" stroke="#185FA5" stroke-width="1.6"/>
  <text x="950" y="380" font-size="22" fill="#633806" text-anchor="start">第2遍</text>

  <rect x="748" y="398" width="192" height="32" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.5"/>
  <line x1="763" y1="414" x2="925" y2="414" stroke="#185FA5" stroke-width="1.6"/>
  <text x="950" y="420" font-size="22" fill="#633806" text-anchor="start">第3遍</text>

  <!-- C→D -->
  <line x1="1020" y1="300" x2="1034" y2="300" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="1042,300 1030,294.5 1030,305.5" fill="#185FA5"/>

  <!-- ============ D 最终工程观测（灰，h 加大 380）============ -->
  <rect x="1040" y="130" width="300" height="380" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2.4"/>
  <text x="1190" y="162" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">最终工程观测</text>

  <!-- D-上：单线加工（h=170）-->
  <rect x="1056" y="182" width="268" height="170" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.8"/>
  <text x="1190" y="212" font-size="26" font-weight="bold" fill="#444441" text-anchor="middle">单线加工</text>
  <line x1="1090" y1="276" x2="1140" y2="276" stroke="#5F5E5A" stroke-width="1.8"/>
  <path d="M1140 276 L1160 296 L1180 276" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="1180" y1="276" x2="1240" y2="276" stroke="#5F5E5A" stroke-width="1.8"/>
  <path d="M1160 296 L1252 296" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>

  <line x1="1245" y1="276" x2="1245" y2="296" stroke="#5F5E5A" stroke-width="1.4"/>
  <line x1="1240" y1="276" x2="1250" y2="276" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="1240" y1="296" x2="1250" y2="296" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="1256" y="294" font-size="22" fill="#5F5E5A" text-anchor="start" font-family="Times New Roman, Times, serif" font-style="italic">d<tspan dy="4" font-size="16">line</tspan></text>

  <line x1="1140" y1="322" x2="1140" y2="334" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="1180" y1="322" x2="1180" y2="334" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="1140" y1="328" x2="1180" y2="328" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="1190" y="334" font-size="22" fill="#5F5E5A" text-anchor="start" font-family="Times New Roman, Times, serif" font-style="italic">w<tspan dy="4" font-size="16">line</tspan></text>

  <!-- D-下：矩形槽加工（y=360, h=140）-->
  <rect x="1056" y="362" width="268" height="140" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.8"/>
  <text x="1190" y="392" font-size="26" font-weight="bold" fill="#444441" text-anchor="middle">矩形槽加工</text>

  <line x1="1080" y1="426" x2="1080" y2="444" stroke="#5F5E5A" stroke-width="1.8"/>
  <line x1="1080" y1="444" x2="1235" y2="444" stroke="#5F5E5A" stroke-width="1.8"/>
  <line x1="1235" y1="426" x2="1235" y2="444" stroke="#5F5E5A" stroke-width="1.8"/>
  <path d="M1092 426 L1223 426" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M1080 444 L1090 426 L1100 444 L1120 444 L1130 426 L1150 426 L1160 444 L1180 444 L1190 426 L1210 426 L1220 444 L1235 444" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

  <line x1="1250" y1="426" x2="1250" y2="444" stroke="#5F5E5A" stroke-width="1.4"/>
  <line x1="1245" y1="426" x2="1255" y2="426" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="1245" y1="444" x2="1255" y2="444" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="1262" y="442" font-size="22" fill="#5F5E5A" text-anchor="start" font-family="Times New Roman, Times, serif" font-style="italic">d<tspan dy="4" font-size="16">groove</tspan></text>

  <text x="1190" y="482" font-size="22" fill="#5F5E5A" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Sa, Sq, Sz</text>

</svg>