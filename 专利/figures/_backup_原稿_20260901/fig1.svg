<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>

  <text x="700" y="60" font-size="32" font-weight="bold" fill="#185FA5" text-anchor="middle">多脉冲扫描加工过程与宏观形貌形成</text>

  <!-- ============ A 工艺输入（灰，加大与 D 区总高度接近）============ -->
  <rect x="40" y="130" width="240" height="156" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="160" y="166" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">激光加工及扫描参数</text>
  <text x="160" y="210" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">P, f, &#964;<tspan dy="5" font-size="19">p</tspan></text>
  <text x="160" y="240" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">v, h, N<tspan dy="5" font-size="19">pass</tspan></text>
  <text x="160" y="270" font-size="26" fill="#5F5E5A" text-anchor="middle">材料及扫描轨迹</text>

  <line x1="160" y1="286" x2="160" y2="296" stroke="#5F5E5A" stroke-width="2"/>
  <polygon points="160,304 154,292 166,292" fill="#5F5E5A"/>

  <rect x="40" y="308" width="240" height="156" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="160" y="344" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">脉冲级局部作用条件</text>
  <text x="160" y="386" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">E<tspan dy="5" font-size="19">p</tspan> = P/f</text>
  <text x="160" y="416" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;t = 1/f</text>
  <text x="160" y="446" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;x = v/f</text>

  <!-- A→B -->
  <line x1="280" y1="386" x2="292" y2="386" stroke="#5F5E5A" stroke-width="2.4"/>
  <polygon points="300,386 288,380.5 288,391.5" fill="#5F5E5A"/>

  <!-- ============ B 单扫描线脉冲作用（蓝，视觉中心，h 缩约 10%）============ -->
  <rect x="300" y="80" width="400" height="370" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.8"/>
  <text x="500" y="114" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">单扫描线上的脉冲作用</text>

  <!-- B-1 重叠光斑 -->
  <text x="500" y="144" font-size="26" fill="#0C447C" text-anchor="middle">重叠光斑（高斯能量分布）</text>
  <text x="512" y="160" font-size="22" fill="#5F5E5A" text-anchor="end">扫描方向</text>
  <line x1="520" y1="156" x2="660" y2="156" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="5 3"/>
  <polygon points="668,156 656,151 656,161" fill="#5F5E5A"/>

  <circle cx="350" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="400" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="450" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="500" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="550" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="600" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <circle cx="650" cy="192" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="350" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle">1</text>
  <text x="400" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle">2</text>
  <text x="450" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle">3</text>
  <text x="500" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle">4</text>
  <text x="550" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle">5</text>
  <text x="600" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">n<tspan dy="0" font-size="18">&#8722;</tspan>1</text>
  <text x="650" y="236" font-size="22" fill="#5F5E5A" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">n</text>

  <!-- Δx 标尺 -->
  <line x1="400" y1="256" x2="450" y2="256" stroke="#5F5E5A" stroke-width="1.6"/>
  <line x1="400" y1="251" x2="400" y2="261" stroke="#5F5E5A" stroke-width="1.6"/>
  <line x1="450" y1="251" x2="450" y2="261" stroke="#5F5E5A" stroke-width="1.6"/>
  <text x="425" y="276" font-size="22" fill="#5F5E5A" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;x</text>

  <!-- B-2 时间轴 -->
  <text x="500" y="306" font-size="22" fill="#0C447C" text-anchor="middle">时间轴：脉冲逐个到达</text>
  <line x1="330" y1="324" x2="660" y2="324" stroke="#5F5E5A" stroke-width="2"/>
  <polygon points="668,324 656,318.5 656,329.5" fill="#5F5E5A"/>
  <circle cx="360" cy="324" r="5" fill="#185FA5"/>
  <circle cx="430" cy="324" r="5" fill="#185FA5"/>
  <circle cx="500" cy="324" r="5" fill="#185FA5"/>
  <circle cx="570" cy="324" r="5" fill="#185FA5"/>
  <circle cx="640" cy="324" r="5" fill="#185FA5"/>

  <!-- Δt 标尺 -->
  <line x1="430" y1="342" x2="500" y2="342" stroke="#5F5E5A" stroke-width="1.6"/>
  <line x1="430" y1="337" x2="430" y2="347" stroke="#5F5E5A" stroke-width="1.6"/>
  <line x1="500" y1="337" x2="500" y2="347" stroke="#5F5E5A" stroke-width="1.6"/>
  <text x="465" y="362" font-size="22" fill="#5F5E5A" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;t</text>

  <!-- B-3 三张等尺寸卡片（y=370, h=80）-->
  <rect x="320" y="370" width="110" height="76" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
  <text x="375" y="392" font-size="22" fill="#0C447C" text-anchor="middle">初始表面</text>
  <line x1="340" y1="416" x2="410" y2="416" stroke="#5F5E5A" stroke-width="2"/>
  <text x="375" y="438" font-size="22" fill="#5F5E5A" text-anchor="middle">未加工</text>

  <line x1="430" y1="408" x2="444" y2="408" stroke="#185FA5" stroke-width="2"/>
  <polygon points="452,408 440,402.5 440,413.5" fill="#185FA5"/>

  <rect x="450" y="370" width="110" height="76" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
  <text x="505" y="392" font-size="22" fill="#0C447C" text-anchor="middle">首个脉冲后</text>
  <path d="M470 416 L492 416 L502 428 L512 416 L550 416" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linejoin="round"/>
  <text x="505" y="438" font-size="22" fill="#5F5E5A" text-anchor="middle">浅坑</text>

  <line x1="560" y1="408" x2="574" y2="408" stroke="#185FA5" stroke-width="2"/>
  <polygon points="582,408 570,402.5 570,413.5" fill="#185FA5"/>

  <rect x="580" y="370" width="110" height="76" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
  <text x="635" y="392" font-size="22" fill="#0C447C" text-anchor="middle">多脉冲累积</text>
  <path d="M598 416 L618 416 L630 430 L645 416 L672 416" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linejoin="round"/>
  <text x="635" y="438" font-size="22" fill="#5F5E5A" text-anchor="middle">连续沟槽</text>

  <!-- B→C -->
  <line x1="700" y1="280" x2="714" y2="280" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="722,280 710,274.5 710,285.5" fill="#185FA5"/>

  <!-- ============ C 多线/多遍累积（橙）============ -->
  <rect x="720" y="130" width="300" height="300" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.4"/>
