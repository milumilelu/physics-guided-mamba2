<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>

  <!-- ============ 上层泳道：前向预测 ============ -->
  <rect x="20" y="70" width="1360" height="350" rx="10" fill="#F7FBFF" stroke="#DCE9F5" stroke-width="1.5"/>
  <text x="44" y="106" font-size="24" font-weight="bold" fill="#185FA5">前向预测</text>

  <!-- A 加工条件 -->
  <rect x="40" y="187" width="200" height="125" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="140" y="219" font-size="26" font-weight="bold" fill="#444441" text-anchor="middle">加工条件</text>
  <text x="140" y="253" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">P, f, &#964;<tspan dy="6" font-size="19">p</tspan></text>
  <text x="140" y="283" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">v, h, N<tspan dy="6" font-size="19">pass</tspan></text>
  <text x="140" y="303" font-size="21" fill="#5F5E5A" text-anchor="middle">材料及扫描轨迹</text>

  <!-- A→B -->
  <line x1="240" y1="250" x2="272" y2="250" stroke="#5F5E5A" stroke-width="2.4"/>
  <polygon points="280,250 268,244.5 268,255.5" fill="#5F5E5A"/>

  <!-- B 脉冲事件序列（h=145, 内部拆 3 行均匀分布） -->
  <rect x="280" y="177" width="200" height="145" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="380" y="211" font-size="26" font-weight="bold" fill="#444441" text-anchor="middle">脉冲事件序列</text>
  <line x1="298" y1="225" x2="462" y2="225" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="380" y="255" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">u<tspan dy="5" font-size="18">1</tspan>, u<tspan dy="5" font-size="18">2</tspan>, ... , u<tspan dy="5" font-size="18">N</tspan></text>
  <text x="380" y="285" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">E<tspan dy="5" font-size="18">p</tspan>, &#916;t, &#916;x</text>
  <text x="380" y="313" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">x<tspan dy="5" font-size="18">n</tspan>, y<tspan dy="5" font-size="18">n</tspan></text>

  <!-- B→C -->
  <line x1="480" y1="250" x2="512" y2="250" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="520,250 508,244.5 508,255.5" fill="#185FA5"/>

  <!-- C 双状态逐脉冲递推模型（核心，最大） -->
  <rect x="520" y="150" width="340" height="200" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.8"/>
  <text x="690" y="182" font-size="27" font-weight="bold" fill="#0C447C" text-anchor="middle">双状态逐脉冲递推模型</text>
  <text x="690" y="216" font-size="28" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">(Hn, Zn) + un</text>
  <line x1="690" y1="226" x2="690" y2="240" stroke="#185FA5" stroke-width="2"/>
  <polygon points="690,246 684,234 696,234" fill="#185FA5"/>
  <text x="690" y="272" font-size="24" fill="#0C447C" text-anchor="middle">材料去除状态计算</text>
  <line x1="690" y1="282" x2="690" y2="296" stroke="#185FA5" stroke-width="2"/>
  <polygon points="690,302 684,290 696,290" fill="#185FA5"/>
  <text x="690" y="328" font-size="28" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;H<tspan dy="6" font-size="20">n</tspan></text>
  <text x="690" y="378" font-size="22" fill="#5F5E5A" text-anchor="middle">循环至加工过程结束</text>

  <!-- C→D -->
  <line x1="860" y1="250" x2="892" y2="250" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="900,250 888,244.5 888,255.5" fill="#185FA5"/>

  <!-- D 预测最终形貌 -->
  <rect x="900" y="187" width="200" height="125" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="1000" y="219" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">预测最终形貌</text>
  <text x="1000" y="252" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="6" font-size="22">N</tspan></text>
  <path d="M930 278 L962 278 L988 300 L1014 278 L1070 278" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- D→E -->
  <line x1="1100" y1="250" x2="1132" y2="250" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="1140,250 1128,244.5 1128,255.5" fill="#185FA5"/>

  <!-- E 预测压缩观测 -->
  <rect x="1140" y="170" width="220" height="160" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="1250" y="200" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">预测压缩观测</text>
  <text x="1250" y="230" font-size="22" fill="#0C447C" text-anchor="middle">单线</text>
  <text x="1250" y="260" font-size="28" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">w&#770;, d&#770;</text>
  <line x1="1156" y1="276" x2="1344" y2="276" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1250" y="302" font-size="22" fill="#0C447C" text-anchor="middle">槽</text>
  <text x="1250" y="326" font-size="22" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">d&#770;<tspan dy="4" font-size="17">g</tspan>, Sa&#770;, Sq&#770;, Sz&#770;</text>

  <!-- ============ 下层泳道：实验校准 ============ -->
  <rect x="20" y="460" width="1360" height="290" rx="10" fill="#FAFAF8" stroke="#E6E4DE" stroke-width="1.5"/>
  <text x="44" y="496" font-size="24" font-weight="bold" fill="#5F5E5A">实验校准</text>

  <!-- F 共聚焦实验 -->
  <rect x="180" y="530" width="240" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="300" y="566" font-size="27" font-weight="bold" fill="#444441" text-anchor="middle">共聚焦实验</text>
  <text x="300" y="610" font-size="24" fill="#444441" text-anchor="middle">单线点云</text>
  <text x="300" y="648" font-size="24" fill="#444441" text-anchor="middle">槽点云</text>

  <!-- F→G -->
  <line x1="420" y1="600" x2="452" y2="600" stroke="#5F5E5A" stroke-width="2.4"/>
  <polygon points="460,600 448,594.5 448,605.5" fill="#5F5E5A"/>

  <!-- G 实测压缩观测 -->
  <rect x="460" y="530" width="240" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="580" y="564" font-size="26" font-weight="bold" fill="#444441" text-anchor="middle">实测压缩观测</text>
  <text x="580" y="600" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="5" font-size="19">line</tspan> = [w, d]</text>
  <text x="580" y="634" font-size="24" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="5" font-size="18">groove</tspan> =</text>
  <text x="580" y="660" font-size="22" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">[d<tspan dy="4" font-size="17">g</tspan>, Sa, Sq, Sz]</text>

  <!-- G→H -->
  <line x1="700" y1="600" x2="732" y2="600" stroke="#BA7517" stroke-width="2.4"/>
  <polygon points="740,600 728,594.5 728,605.5" fill="#BA7517"/>

  <!-- H 单线—槽联合校准（下层视觉中心） -->
  <rect x="740" y="530" width="240" height="140" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.8"/>
  <text x="860" y="564" font-size="25" font-weight="bold" fill="#633806" text-anchor="middle">单线—槽联合校准</text>
  <text x="860" y="600" font-size="23" fill="#633806" text-anchor="middle">比较预测与实测</text>
  <line x1="860" y1="610" x2="860" y2="622" stroke="#BA7517" stroke-width="2"/>
  <polygon points="860,628 854,617 866,617" fill="#BA7517"/>
  <text x="860" y="654" font-size="25" font-weight="bold" fill="#633806" text-anchor="middle">联合反演 / 训练</text>

  <!-- H→I -->
  <line x1="980" y1="600" x2="1012" y2="600" stroke="#BA7517" stroke-width="2.4"/>
  <polygon points="1020,600 1008,594.5 1008,605.5" fill="#BA7517"/>

  <!-- I 模型参数更新 -->
  <rect x="1020" y="530" width="240" height="140" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
  <text x="1140" y="564" font-size="27" font-weight="bold" fill="#633806" text-anchor="middle">模型参数更新</text>
  <text x="1140" y="600" font-size="23" fill="#633806" text-anchor="middle">历史状态转移参数</text>
  <text x="1140" y="628" font-size="23" fill="#633806" text-anchor="middle">门控参数</text>
  <text x="1140" y="656" font-size="22" fill="#633806" text-anchor="middle">材料去除子模型参数</text>

  <!-- ============ 唯一一根上下连接：预测压缩观测 → 联合校准（变细变淡） ============ -->
  <path d="M1250 330 L1250 430 L860 430 L860 522" fill="none" stroke="#D4A574" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="860,530 854,518 866,518" fill="#D4A574"/>

  <!-- ============ 唯一一根反馈线：参数更新 → 核心模型（底部90°折线，变细变淡） ============ -->
  <path d="M1140 670 L1140 785 L720 785 L720 358" fill="none" stroke="#6B96C8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="720,350 714,362 726,362" fill="#6B96C8"/>
  <text x="930" y="778" font-size="22" fill="#5F5E5A" text-anchor="middle">反馈更新模型参数</text>

</svg>
