<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>

  <text x="700" y="58" font-size="32" font-weight="bold" fill="#185FA5" text-anchor="middle">实测—预测成对比较与联合反演</text>

  <!-- 列标签 -->
  <text x="160" y="108" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">来源链</text>
  <text x="460" y="108" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">单线比较</text>
  <text x="780" y="108" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">槽比较</text>
  <text x="1160" y="108" font-size="26" font-weight="bold" fill="#0C447C" text-anchor="middle">联合反演</text>

  <!-- ============ 列 1：来源链 ============ -->
  <rect x="40" y="140" width="240" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="160" y="174" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">共聚焦原始点云</text>
  <text x="160" y="214" font-size="24" fill="#5F5E5A" text-anchor="middle">单线 + 槽（统一坐标系）</text>

  <line x1="160" y1="240" x2="160" y2="252" stroke="#5F5E5A" stroke-width="2.2"/>
  <polygon points="160,258 154,246 166,246" fill="#5F5E5A"/>

  <rect x="40" y="260" width="240" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="160" y="294" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">统一预处理</text>
  <text x="160" y="334" font-size="24" fill="#5F5E5A" text-anchor="middle">参考面校正 / 重采样</text>

  <line x1="160" y1="360" x2="160" y2="372" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="160,378 154,366 166,366" fill="#185FA5"/>

  <rect x="40" y="380" width="240" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.4"/>
  <text x="160" y="414" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">双状态门控模型<tspan font-size="18" fill="#185FA5" dx="4"> 6</tspan></text>
  <text x="160" y="452" font-size="24" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, Z</tspan><tspan dy="5" font-size="20">n</tspan><tspan dy="-5">, u</tspan><tspan dy="5" font-size="20">n</tspan></text>

  <line x1="160" y1="480" x2="160" y2="492" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="160,498 154,486 166,486" fill="#185FA5"/>

  <rect x="40" y="500" width="240" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.4"/>
  <text x="160" y="534" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">预测最终形貌</text>
  <text x="160" y="576" font-size="34" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="6" font-size="22">N</tspan></text>

  <!-- H_N 分叉 → 预测单线 & 预测槽 -->
  <line x1="160" y1="550" x2="290" y2="550" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="290" y1="550" x2="290" y2="430" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="290" y1="430" x2="312" y2="430" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="320,430 308,424 308,436" fill="#185FA5"/>

  <line x1="160" y1="550" x2="620" y2="550" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="620" y1="550" x2="620" y2="430" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="620" y1="430" x2="632" y2="430" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="640,430 628,424 628,436" fill="#185FA5"/>

  <!-- ============ 列 2：单线比较 ============ -->
  <rect x="320" y="140" width="280" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="460" y="174" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">实测单线观测<tspan font-size="18" fill="#BA7517" dx="4"> 4</tspan></text>
  <text x="460" y="214" font-size="26" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="5" font-size="20">line</tspan> = [ w, d ]</text>

  <line x1="460" y1="240" x2="460" y2="252" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="460,258 454,246 466,246" fill="#BA7517"/>

  <rect x="320" y="260" width="280" height="100" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.4"/>
  <text x="460" y="298" font-size="28" font-weight="bold" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L<tspan dy="5" font-size="20">line</tspan></text>
  <text x="460" y="336" font-size="22" fill="#633806" text-anchor="middle">实测 vs 预测</text>

  <line x1="460" y1="380" x2="460" y2="368" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="460,362 454,374 466,374" fill="#BA7517"/>

  <rect x="320" y="380" width="280" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.4"/>
  <text x="460" y="416" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">预测单线观测</text>
  <text x="460" y="454" font-size="26" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Ŷ<tspan dy="5" font-size="20">line</tspan> = O<tspan dy="5" font-size="20">line</tspan> ( H<tspan dy="5" font-size="20">N</tspan> )</text>

  <line x1="600" y1="310" x2="940" y2="310" stroke="#BA7517" stroke-width="2.2"/>
  <line x1="940" y1="310" x2="940" y2="282" stroke="#BA7517" stroke-width="2.2"/>
  <line x1="940" y1="282" x2="952" y2="282" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="960,282 948,276 948,288" fill="#BA7517"/>

  <!-- ============ 列 3：槽比较 ============ -->
  <rect x="640" y="140" width="280" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="780" y="174" font-size="28" font-weight="bold" fill="#444441" text-anchor="middle">实测槽观测<tspan font-size="18" fill="#BA7517" dx="4"> 5</tspan></text>
  <text x="780" y="214" font-size="22" fill="#444441" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Y<tspan dy="4" font-size="18">groove</tspan> = [ d, S<tspan dy="4" font-size="18">a</tspan>, S<tspan dy="4" font-size="18">q</tspan>, S<tspan dy="4" font-size="18">z</tspan> ]</text>

  <line x1="780" y1="240" x2="780" y2="252" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="780,258 774,246 786,246" fill="#BA7517"/>

  <rect x="640" y="260" width="280" height="100" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.4"/>
  <text x="780" y="298" font-size="28" font-weight="bold" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L<tspan dy="5" font-size="20">groove</tspan></text>
  <text x="780" y="336" font-size="22" fill="#633806" text-anchor="middle">实测 vs 预测</text>

  <line x1="780" y1="380" x2="780" y2="368" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="780,362 774,374 786,374" fill="#BA7517"/>

  <rect x="640" y="380" width="280" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.4"/>
  <text x="780" y="416" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">预测槽观测</text>
  <text x="780" y="454" font-size="22" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Ŷ<tspan dy="4" font-size="18">groove</tspan> = O<tspan dy="4" font-size="18">groove</tspan> ( H<tspan dy="4" font-size="18">N</tspan> )</text>

  <line x1="920" y1="320" x2="945" y2="320" stroke="#BA7517" stroke-width="2.2"/>
  <line x1="945" y1="320" x2="945" y2="382" stroke="#BA7517" stroke-width="2.2"/>
  <line x1="945" y1="382" x2="952" y2="382" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="960,382 948,376 948,388" fill="#BA7517"/>

  <!-- ============ 列 4 上：三个并列附加约束 ============ -->
  <rect x="960" y="140" width="140" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.2"/>
  <text x="1030" y="174" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L<tspan dy="4" font-size="18">phys</tspan></text>
  <text x="1030" y="204" font-size="22" fill="#633806" text-anchor="middle">物理守恒</text>

  <rect x="1100" y="140" width="140" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.2"/>
  <text x="1170" y="174" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L<tspan dy="4" font-size="18">state</tspan></text>
  <text x="1170" y="204" font-size="22" fill="#633806" text-anchor="middle">状态约束</text>

  <rect x="1240" y="140" width="120" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.2"/>
  <text x="1300" y="174" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L<tspan dy="4" font-size="18">gate</tspan></text>
  <text x="1300" y="204" font-size="22" fill="#633806" text-anchor="middle">门控正则</text>

  <!-- 三个 L_xxx → 联合目标函数 -->
  <line x1="1030" y1="220" x2="1030" y2="232" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="1030,238 1024,226 1036,226" fill="#BA7517"/>

  <line x1="1170" y1="220" x2="1170" y2="232" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="1170,238 1164,226 1176,226" fill="#BA7517"/>

  <line x1="1300" y1="220" x2="1300" y2="232" stroke="#BA7517" stroke-width="2.2"/>
  <polygon points="1300,238 1294,226 1306,226" fill="#BA7517"/>

  <!-- ============ 联合目标函数 L（加宽 + 公式拆 3 行）============ -->
  <rect x="960" y="240" width="400" height="200" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.8"/>
  <text x="1160" y="274" font-size="28" font-weight="bold" fill="#633806" text-anchor="middle">联合目标函数<tspan font-size="18" fill="#BA7517" dx="4"> 7</tspan></text>

  <text x="1160" y="316" font-size="22" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">L = &#955;<tspan dy="4" font-size="18">L</tspan> L<tspan dy="4" font-size="18">line</tspan><tspan dy="-4"> + &#955;</tspan><tspan dy="4" font-size="18">G</tspan> L<tspan dy="4" font-size="18">groove</tspan></text>
  <text x="1160" y="350" font-size="22" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">+ &#955;<tspan dy="4" font-size="18">P</tspan> L<tspan dy="4" font-size="18">phys</tspan><tspan dy="-4"> + &#955;</tspan><tspan dy="4" font-size="18">S</tspan> L<tspan dy="4" font-size="18">state</tspan></text>
  <text x="1160" y="384" font-size="22" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">+ &#955;<tspan dy="4" font-size="18">M</tspan> L<tspan dy="4" font-size="18">gate</tspan></text>

  <line x1="990" y1="408" x2="1330" y2="408" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="1160" y="428" font-size="22" fill="#5F5E5A" text-anchor="middle">五项独立并列汇聚于同一标量目标</text>

  <!-- L → 联合反演/参数更新 -->
  <line x1="1160" y1="440" x2="1160" y2="452" stroke="#BA7517" stroke-width="2.4"/>
  <polygon points="1160,458 1154,446 1166,446" fill="#BA7517"/>

  <!-- ============ 联合反演 / 参数更新 ============ -->
  <rect x="960" y="460" width="400" height="180" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2.4"/>
  <text x="1160" y="496" font-size="28" font-weight="bold" fill="#633806" text-anchor="middle">联合反演 / 参数更新</text>
  <line x1="990" y1="516" x2="1330" y2="516" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="1160" y="554" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">S<tspan dy="5" font-size="20">&#952;</tspan><tspan dy="-5">    历史状态转移参数</tspan></text>
  <text x="1160" y="592" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">G<tspan dy="5" font-size="20">&#952;</tspan><tspan dy="-5">    门控参数</tspan></text>
  <text x="1160" y="630" font-size="26" fill="#633806" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="5" font-size="20">m</tspan><tspan dy="-5">    去除子模型参数</tspan></text>

  <!-- ============ 唯一一根底部反馈线 ============ -->
  <path d="M 1160 640 L 1160 720 L 160 720 L 160 488" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-dasharray="7 4"/>
  <polygon points="160,480 154,492 166,492" fill="#185FA5"/>
  <text x="660" y="712" font-size="24" fill="#185FA5" text-anchor="middle">更新模型参数（反馈校准）</text>

</svg>
