<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>

  <text x="700" y="58" font-size="32" font-weight="bold" fill="#185FA5" text-anchor="middle">单脉冲内部计算流程</text>

  <!-- 列标签 -->
  <text x="160" y="110" font-size="26" fill="#0C447C" text-anchor="middle">当前状态 / 输入</text>
  <text x="440" y="110" font-size="26" fill="#0C447C" text-anchor="middle">门控</text>
  <text x="650" y="110" font-size="26" fill="#0C447C" text-anchor="middle">去除子模型</text>
  <text x="900" y="110" font-size="26" fill="#0C447C" text-anchor="middle">加权组合</text>
  <text x="1210" y="110" font-size="26" fill="#0C447C" text-anchor="middle">下一状态</text>

  <!-- ============ 第 1 列：三个输入（严格同宽同高 240×130）============ -->
  <rect x="40" y="150" width="240" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="160" y="198" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">当前表面形貌</text>
  <text x="160" y="258" font-size="36" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="6" font-size="24">n</tspan></text>

  <rect x="40" y="355" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="160" y="403" font-size="28" font-weight="bold" fill="#A32D2D" text-anchor="middle">当前历史材料状态</text>
  <text x="160" y="463" font-size="36" fill="#A32D2D" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Z<tspan dy="6" font-size="24">n</tspan></text>

  <rect x="40" y="560" width="240" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="160" y="608" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">当前激光作用条件</text>
  <text x="160" y="668" font-size="36" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">u<tspan dy="6" font-size="24">n</tspan></text>

  <!-- 第1列 → 门控 -->
  <line x1="280" y1="215" x2="302" y2="215" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="302" y1="215" x2="302" y2="350" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="302" y1="350" x2="312" y2="350" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="320,350 308,344 308,356" fill="#185FA5"/>

  <line x1="280" y1="420" x2="312" y2="420" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="320,420 308,414 308,426" fill="#185FA5"/>

  <line x1="280" y1="625" x2="302" y2="625" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="302" y1="625" x2="302" y2="490" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="302" y1="490" x2="312" y2="490" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="320,490 308,484 308,496" fill="#185FA5"/>

  <!-- ============ 第 2 列：门控（只留 1 主公式 + 2 约束）============ -->
  <rect x="320" y="270" width="240" height="300" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.8"/>
  <text x="440" y="320" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">材料去除状态门控</text>

  <text x="440" y="398" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="6" font-size="20">n</tspan><tspan dy="-6"> = G</tspan><tspan dy="6" font-size="20">&#952;</tspan><tspan dy="-6">(H</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, Z</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, u</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">)</tspan></text>

  <line x1="348" y1="428" x2="532" y2="428" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="440" y="482" font-size="28" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="6" font-size="19">m,n</tspan><tspan dy="-6"> &#8805; 0</tspan></text>

  <text x="440" y="534" font-size="28" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#8721;<tspan dy="6" font-size="19">m</tspan><tspan dy="-6"> &#960;</tspan><tspan dy="6" font-size="19">m,n</tspan><tspan dy="-6"> = 1</tspan></text>

  <!-- 门控 → 子模型（扇出，正交折线） -->
  <line x1="560" y1="350" x2="576" y2="350" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="576" y1="350" x2="576" y2="305" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="576" y1="305" x2="582" y2="305" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="590,305 578,299 578,311" fill="#185FA5"/>

  <line x1="560" y1="420" x2="582" y2="420" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="590,420 578,414 578,426" fill="#185FA5"/>

  <line x1="560" y1="490" x2="576" y2="490" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="576" y1="490" x2="576" y2="535" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="576" y1="535" x2="582" y2="535" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="590,535 578,529 578,541" fill="#185FA5"/>

  <!-- ============ 第 3 列：子模型（严格一列，等尺寸 120×90）============ -->
  <rect x="590" y="260" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
  <text x="650" y="322" font-size="34" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="6" font-size="23">1</tspan></text>

  <rect x="590" y="375" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
  <text x="650" y="437" font-size="34" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="6" font-size="23">2</tspan></text>

  <rect x="590" y="490" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
  <text x="650" y="552" font-size="34" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="6" font-size="23">M</tspan></text>

  <!-- 省略号（虚线） -->
  <line x1="650" y1="356" x2="650" y2="369" stroke="#185FA5" stroke-width="2" stroke-dasharray="3 4"/>
  <line x1="650" y1="471" x2="650" y2="484" stroke="#185FA5" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- 子模型 → 加权组合（带 π 权重标签） -->
  <line x1="710" y1="305" x2="745" y2="305" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="745" y1="305" x2="745" y2="350" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="745" y1="350" x2="772" y2="350" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="780,350 768,344 768,356" fill="#185FA5"/>
  <text x="745" y="296" font-size="26" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="6" font-size="18">1,n</tspan></text>

  <line x1="710" y1="420" x2="772" y2="420" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="780,420 768,414 768,426" fill="#185FA5"/>
  <text x="745" y="411" font-size="26" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="6" font-size="18">2,n</tspan></text>

  <line x1="710" y1="535" x2="745" y2="535" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="745" y1="535" x2="745" y2="490" stroke="#185FA5" stroke-width="2.2"/>
  <line x1="745" y1="490" x2="772" y2="490" stroke="#185FA5" stroke-width="2.2"/>
  <polygon points="780,490 768,484 768,496" fill="#185FA5"/>
  <text x="745" y="526" font-size="26" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#960;<tspan dy="6" font-size="18">M,n</tspan></text>

  <!-- ============ 第 4 列：加权组合（只留两行公式，无正文）============ -->
  <rect x="780" y="310" width="240" height="220" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.4"/>
  <text x="900" y="356" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">加权组合</text>

  <text x="900" y="432" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">&#916;H<tspan dy="6" font-size="20">n</tspan><tspan dy="-6"> = &#8721;</tspan><tspan dy="6" font-size="20">m</tspan><tspan dy="-6"> &#960;</tspan><tspan dy="6" font-size="20">m,n</tspan><tspan dy="-6"> A</tspan><tspan dy="6" font-size="20">m</tspan></text>

  <text x="900" y="492" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">A<tspan dy="6" font-size="20">m</tspan><tspan dy="-6"> = A</tspan><tspan dy="6" font-size="20">m</tspan><tspan dy="-6">(H</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, Z</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, u</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">)</tspan></text>

  <!-- 加权组合 → 双状态同步更新 -->
  <line x1="1020" y1="420" x2="1052" y2="420" stroke="#185FA5" stroke-width="2.4"/>
  <polygon points="1060,420 1048,414 1048,426" fill="#185FA5"/>

  <!-- ============ 第 5 列：双状态同步更新（只放两公式 + 一行说明）============ -->
  <rect x="1060" y="280" width="300" height="280" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.8"/>
  <text x="1210" y="326" font-size="28" font-weight="bold" fill="#0C447C" text-anchor="middle">双状态同步更新</text>

  <text x="1210" y="402" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">H<tspan dy="6" font-size="20">n+1</tspan><tspan dy="-6"> = U(H</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, &#916;H</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">)</tspan></text>

  <text x="1210" y="452" font-size="30" fill="#0C447C" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic">Z<tspan dy="6" font-size="20">n+1</tspan><tspan dy="-6"> = S</tspan><tspan dy="6" font-size="20">&#952;</tspan><tspan dy="-6">(Z</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, H</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, u</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">, &#916;t</tspan><tspan dy="6" font-size="20">n</tspan><tspan dy="-6">)</tspan></text>

  <line x1="1086" y1="480" x2="1334" y2="480" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="1210" y="526" font-size="26" fill="#0C447C" text-anchor="middle">下一作用事件的状态输入</text>

</svg>