schema_version: 1
frozen_at_local: '2026-08-31'
authority: user_approved_after_wp9_common_fov_review
policy:
  preserve_raw_and_diagnostic_outputs: true
  forbid_silent_drop: true
  exclude_from: [registered_exports, phase_a_analysis, phase_b_analysis]
exclusions:
  - session_id: zro2_60_pass
    measurement_ids: [27]
    sample_ids: [53, 54]
    reason: Measurement 27 limits session common FOV to 248.85 um; excluding the complete paired measurement restores 265.80 um.
    disposition: excluded_complete_paired_measurement
  - session_id: zro2_20_supplement
    all_measurements: true
    all_samples: true
    reason: Paired acquisition layout provides only 197.39 um common centred FOV; 13 of 20 samples cannot support a full 200 um square without extrapolation.
    disposition: remeasurement_required
