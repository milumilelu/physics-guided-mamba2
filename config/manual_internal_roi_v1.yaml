method: manual_internal_roi_v1_fast_80um
evidence_level: 3
annotation_csv: annotations/manual_four_edge_validation_frozen.csv
registration_csv: config/frozen/manual_registration_200.csv
plane_csv: config/frozen/measurement_planes_160.csv
session_manifest: config/session_manifest.csv
output_root: outputs/rectangle_registration/manual_internal_roi_v1

stable_roi:
  # Full-batch nested-size sensitivity (60..120 um) selected 80 um as the
  # stability knee: edge/core gradient ratio median=1.007, P90=1.124.
  width_um: 80.0
  height_um: 80.0
  pixel_um: 0.5
  minimum_valid_fraction: 0.99

conical_dropout:
  background_radius_um: 4.0
  seed_sigma: 8.0
  grow_sigma: 4.0
  minimum_seed_depth_um: 0.8
  minimum_grow_depth_um: 0.35
  minimum_pixels: 3
  maximum_span_um: 20.0
  maximum_aspect_ratio: 2.8
  minimum_bbox_fill: 0.12
  boundary_protection_um: 5.0
  ring_width_um: 3.0

qa:
  core_halfwidth_um: 30.0
  edge_ring_width_um: 10.0
  montage_samples_per_session: 6
