# =============================================================================
# 矩形加工区配准与统一稳定 ROI —— 主配置
#
# 历史上位规范 : archive/rectangle_registration_history/CODEX_TASK_矩形加工区配准与稳定ROI_v2.md
# 历史执行方案 : archive/rectangle_registration_history/WORKBUDDY_EXECUTION_PLAN_矩形加工区配准与稳定ROI.md
# 当前后续规范 : 任务说明书/WORKBUDDY_下一阶段_人工框内稳定ROI_v1.md
# 锚定提交 : b31a83f
# 编写日期 : 2026-08-30 (WP0)
#
# 使用约定
#   1. 本文件只保存【规则】，不保存【结果】。角度、D4、L_reg、ROI 尺寸等结果
#      一律写入 outputs/ 下的 JSON / CSV，绝不回写本文件。
#   2. 值为 auto 或 null 的键，必须在运行时解析为具体数值并记录进 run_manifest，
#      不得把 auto 字符串本身传给下游算法。
#   3. 观察任何结果之后不得修改本文件。确需修改时必须新建修订记录并重新走门禁。
# =============================================================================

schema_version: 1
random_seed: 42
nominal_programmed_region_um: [200.0, 200.0]

# -----------------------------------------------------------------------------
# 路径：全部相对仓库根，禁止硬编码绝对路径
# -----------------------------------------------------------------------------
paths:
  repo_root: .
  outputs_root: outputs/rectangle_registration
  session_manifest: config/session_manifest.csv
  height_source_manifest: config/height_source_manifest.csv
  manual_orientation: config/manual_orientation.yaml
  phase_a_exclusions: config/phase_a_exclusions.yaml
  # v6 is the best automated candidate but remains Phase-A BLOCKED.
  # v7 was rejected after its frozen full run (17 STOP versus v6's 8).
  registration_metrics: outputs/rectangle_registration/registration/translation_metrics_v6.csv
  data_root: 氧化锆/pass实验数据
  csv_root: 氧化锆/pass实验数据/csv文件
  fixture_root: 氧化锆/pass实验数据/csv文件/fixture

# -----------------------------------------------------------------------------
# 输入与来源登记
# -----------------------------------------------------------------------------
input:
  # 原始唯一真值来源是 CAG；CSV 只是中间产物或独立 fixture
  primary_format: cag
  fallback_format: vk_csv

  # WP3 门禁：等价证据未 PASS 前，禁止任何批量读取
  equivalence_gate:
    required: true
    evidence_path: outputs/rectangle_registration/phase0/equivalence/cag_csv_equivalence.json
    allow_derived_csv_as_truth: false
    on_missing_evidence: stop

  # 无效像素哨兵（CAG raw u32）
  invalid_sentinel_rule: raw >= 0xFF000000
  invalid_representation: nan            # H_raw 中无效点必须是 NaN
  fill_invalid_forbidden: true           # 正式路径禁止任何填补

  height_sign: upward
  height_sign_scope: session_fixed       # 禁止逐文件自动翻转
  unit: um

  # WP1 来源类型白名单
  allowed_source_types:
    - keyence_official_export            # 可作独立等价 fixture
    - cag_decoder_derived                # 只可作处理输入，不可作真值
    - unknown                            # 不可作 fixture

provenance:
  require_csv_sha256: true
  require_export_tool: true
  forbid_filename_guessing: true         # 不得凭文件名外观推断来源
  default_when_unproven: unknown
  fail_on_unknown: true                  # 出现 unknown 即 STOP，不得默认放行

  # ---------------------------------------------------------------------------
  # 来源判定 = 客观签名 + 人工背书，二者缺一不可。
  # 签名规则在查看任何文件内容之前注册，写成显式区间而不是"看起来像"。
  # 依据（2026-08-30 实测，写入 run_manifest）：
  #   * KEYENCE 手工导出：写临时文件后提交，mtime-ctime 稳定 6.5-6.7 s，
  #     相邻文件间隔 16-53 s（人工节奏）。
  #   * export_height_csv.py：直接写入，mtime-ctime ≈ 1.0 s，间隔 ≈ 1.1 s。
  #   * 120正式 的 100-120 号：ctime 早 2968 s，属 16:43 的 index 命名批次，
  #     因 index 名与 data 名相同而被 --skip-existing 保留，后被同批 mtime 覆盖。
  # ---------------------------------------------------------------------------
  signature_rules:
    - name: keyence_manual_export
      source_type: keyence_official_export
      export_tool: KEYENCE VK-X3000 software (manual export)
      mtime_minus_ctime_s: [5.0, 8.0]
      require_nearest_gap_ge_s: 10.0
      evidence_grade: strong_circumstantial
      attested_by: user
      attested_on: '2026-08-30'

    - name: decoder_batch_export
      source_type: cag_decoder_derived
      export_tool: export_height_csv.py
      mtime_minus_ctime_s: [0.0, 3.0]
      evidence_grade: strong_circumstantial
      attested_by: session_log
      attested_on: '2026-08-30'

    - name: decoder_batch_renamed
      source_type: cag_decoder_derived
      export_tool: export_height_csv.py
      mtime_minus_ctime_s: [100.0, 1000000.0]
      require_cluster_contains: decoder_batch_export
      evidence_grade: moderate_circumstantial
      attested_by: session_log
      attested_on: '2026-08-30'

  # mtime 间隔超过此值视为不同批次
  cluster_gap_s: 5.0

# -----------------------------------------------------------------------------
# 文件名与数量规则 (WP1)
# -----------------------------------------------------------------------------
naming:
  file_suffix: _高度.csv
  single_pattern: '^(\d+)_高度\.csv$'
  paired_pattern: '^(\d+) (\d+)_高度\.csv$'
  paired_token_separator: ' '
  parse_order: natural_number            # 禁止字符串字典序

  exclude_dir_prefixes:
    - _待清理_                            # 旧补零命名目录，必须排除
  exclude_dirs:
    - 氧化锆/pass实验数据/csv文件/_待清理_旧索引命名_120正式

  # ★ slot -> sample 只能读 CAG 数据名，禁止推导 (方案 R3)
  slot_mapping:
    source_of_truth: cag_data_name
    forbid_derived_formula: true         # 禁止 2m-1 / 2m 之类
    forbid_reorder_tokens: true          # 解析后不得重排成升序
    forbid_odd_even_assertion: true     # 不得断言 slot_1 必须是奇数
    slot_names: [slot_1, slot_2]

expected_counts:
  measurements_total: 160
  samples_total: 200
  per_session:
    zro2_120_formal: {measurements: 120, samples: 120, rectangles_per_measurement: 1}
    zro2_60_pass: {measurements: 30, samples: 60, rectangles_per_measurement: 2}
    zro2_20_supplement: {measurements: 10, samples: 20, rectangles_per_measurement: 2}

# -----------------------------------------------------------------------------
# 设计表字段映射 (方案 §2.5)
# -----------------------------------------------------------------------------
design:
  encoding: gbk
  sample_id_column: 加工顺序
  column_map:
    sample_id: 加工顺序
    stage_center_x_mm: 中心X
    stage_center_y_mm: 中心Y
    pulse_width: 脉宽
    frequency: 频率
    hatch: 线间距
    pass: 次数
    velocity: 速度
  stratification_variables: [pulse_width, frequency, hatch, pass, velocity]

  # ★ 载台坐标的证据等级：WP7 前只能作搜索域先验 (方案 §2.5.1)
  stage_center_prior:
    role: search_domain_prior_only
    usable_after: session_geometry_calibrated
    forbid_in_objective: true
    forbid_absolute_error_report_before: session_geometry_calibrated

# -----------------------------------------------------------------------------
# Coarse leveling (WP6)
# -----------------------------------------------------------------------------
coarse_leveling:
  central_exclusion_um: [320.0, 320.0]
  # Primary reference for both single- and paired-rectangle measurements.
  # A central exclusion alone would include the two off-centre paired slots.
  outer_frame_width_um: 50.0
  max_fit_points: 200000
  method: asymmetric_sigma_clip
  sigma_low: 2.0
  sigma_high: 3.0
  max_iterations: 10
  minimum_reference_valid_fraction: 0.20
  require_multi_quadrant_coverage: true
  require_xy_span: true
  forbid_whole_image_ols: true
  on_insufficient_reference: hard_flag    # 不得静默删除或降级
  output_fields:
    - coarse_plane_a
    - coarse_plane_b
    - coarse_plane_c
    - coarse_plane_rmse
    - coarse_reference_fraction
    - coarse_leveling_warning

# -----------------------------------------------------------------------------
# Contrast diagnostics：不依赖单一绝对阈值 (WP5 / WP6)
# -----------------------------------------------------------------------------
contrast_diagnostics:
  quantiles: [0.01, 0.05, 0.50, 0.95, 0.99]
  metrics:
    - valid_fraction
    - q50_minus_q05
    - negative_tail_amplitude            # |Q01 - Q50|
    - inside_outside_contrast
    - edge_energy
    - modified_area_fraction
    - invalid_component_count
    - invalid_component_max_area_um2
  candidate_modified_area:
    # 用于 inside/outside contrast 的候选区半宽，先于结果固定
    halfwidth_um: 100.0

calibration:
  selection_fraction: 0.25
  minimum_calibration_per_session: 8
  stratify_by: [pulse_width, frequency, hatch, pass, velocity]

  # 交叉分层会产生大量小格，故用小格 + 边缘水平回退
  stratification:
    mode: tuple_with_marginal_fallback
    minimum_strata_size: 5
    fallback: marginal_level

  forbid_top_deepest_only: true           # 禁止只选最深的 top 25%

  # 层内排序：会话内百分位秩的预注册加权和，权重先于结果固定
  ranking_score:
    contrast_pctile: 0.4
    edge_energy_pctile: 0.4
    valid_fraction_pctile: 0.2
  rank_within: session

  freeze_before: [session_geometry_fitting]
  freeze_artifact: outputs/rectangle_registration/calibration/calibration_sample_ids.csv

# -----------------------------------------------------------------------------
# Session 几何：连续角度与 D4 (WP7)
# -----------------------------------------------------------------------------
session_geometry:
  theta:
    fold_range_deg: [-45.0, 45.0]
    estimator: weighted_median
    quality_weights:
      edge_completeness: 0.35
      fit_residual: 0.25
      area_consistency: 0.20
      contrast: 0.20
    warning_mad_deg: 0.3
    review_mad_deg: 0.8
    multimodality:
      check: true
      rule: histogram_bimodality
      bins_deg: 0.5
      on_multimodal: stop                # 不得强行平均
    free_fit:
      nominal_size_um: 200.0
      crop_margin_um: 35.0
      threshold_fractions: [0.35, 0.50, 0.65]
      component_area_ratio: [0.35, 1.75]
      boundary_quantile: 0.005
      angle_grid_step_deg: 0.05
      minimum_successful_thresholds: 2

  d4:
    scope: session_fixed                 # 禁止逐样本自选象限或翻转
    require_manual_confirmation: true
    evidence_sources:
      - pooled_morphology
      - microscope_orientation
      - manual_confirmation
    fallback_status: requires_manual_confirmation
    on_unconfirmed: stop_before_h_reg_export
    forbid_flip_by_deeper_side: true

  # 结果不允许写回本文件，只写 outputs
  resolved:
    theta_session_deg: null
    d4_transform_session: null

  manual_gate_A0:
    require_all_sessions_confirmed: true
    confirmation_file: config/manual_orientation.yaml
    required_status: confirmed

# -----------------------------------------------------------------------------
# 单样本受约束平移配准 (WP8)
# -----------------------------------------------------------------------------
registration:
  fixed:
    theta: theta_session_deg
    d4: d4_transform_session
    nominal_size_um: [200.0, 200.0]
    height_sign: session_fixed
  optimize_only: [center_x_um, center_y_um]

  center_search:
    primary_prior: image_center
    halfwidth_um: 50.0
    on_boundary_hit: review
    forbid_prior_in_objective: true

  numerical_search:
    coarse_radius_um: 12.0
    coarse_grid_step_um: 2.0
    coarse_score_sampling_um: 2.0
    fine_radius_um: 2.0
    fine_grid_step_um: 0.5
    fine_score_sampling_um: 1.0

  scores:
    normalize_before_weighting: true
    region_score:
      formula: (median_outside - median_inside) / (1.4826 * MAD_outside)
    edge_score:
      band_um: 15.0
      normalize_by: outside_gradient_scale
      require_edge_exactly_at_100um: false

  weights:
    primary: [0.5, 0.5]
    sensitivity:
      - [0.25, 0.75]
      - [0.5, 0.5]
      - [0.75, 0.25]
    forbid_post_hoc_selection: true
    unstable_shift_um: 3.0

paired_registration:
  solve: joint_with_exclusion
  search_domain_rule: split_fov_along_separation_axis
  guard_band_um: 20.0
  minimum_center_separation_um: 300.0    # 实测载台间距 400-500 um，WP5 需复核
  forbid_same_rectangle_match: true
  on_same_rectangle_match: fail_both_samples
  on_slot_order_conflict: fail_both_samples
  conflict_flag: slot_assignment_conflict

# -----------------------------------------------------------------------------
# v3 主配准：固定 session 几何下的受约束四边稳健拟合
# 冻结日期 2026-08-31；v2 region/edge 加权结果仅保留为 QA 对照。
# -----------------------------------------------------------------------------
registration_v3:
  method: constrained_four_signed_edge_profiles
  evidence_level: 3
  fixed: [theta_session_deg, d4_transform_session, nominal_size_um]
  optimize_only: [center_x_um, center_y_um]
  nominal_size_um: 200.0
  local_canvas_um: 270.0
  profile_strip_halfwidth_um: 70.0
  smoothing_sigma_um: 1.0
  edge_search_halfwidth_um: 20.0
  peak_centroid_halfwidth_um: 3.0
  edge_snr:
    minimum: 3.0
    review_below: 5.0
  observed_width_um:
    hard_range: [180.0, 220.0]
  constrained_edge_residual_um:
    review_above: 4.0
    hard_maximum: 10.0
  center_boundary_tolerance_um: 0.5
  legacy_region_edge_role: qa_only
  forbid_absolute_error_claim: true

# -----------------------------------------------------------------------------
# v4 主配准：多尺度联合四边模板 + 切向分块 bootstrap
# 冻结日期 2026-08-31；对全部样本统一运行，不作为 v3 失败样本专用 fallback。
# -----------------------------------------------------------------------------
registration_v4:
  method: multiscale_joint_four_edge_block_bootstrap
  evidence_level: 3
  fixed: [theta_session_deg, d4_transform_session, nominal_size_um]
  optimize_only: [center_x_um, center_y_um]
  nominal_size_um: 200.0
  local_canvas_um: 270.0
  edge_search_halfwidth_um: 20.0
  center_grid_step_um: 0.25
  profile_strip_halfwidth_um: 70.0
  smoothing_scales_um: [0.75, 1.0, 1.5]
  tangent_blocks: 8
  bootstrap_replicates_per_scale: 64
  random_seed: 20260831
  joint_evidence:
    hard_minimum_total: 8.0
    review_below_total: 12.0
    hard_minimum_per_axis: 3.0
  uncertainty:
    ci_quantiles: [0.025, 0.975]
    review_ci_span_um: 6.0
    hard_ci_span_um: 12.0
    review_mad_um: 1.5
    hard_mad_um: 3.0
  multimodality:
    histogram_bin_um: 1.0
    minimum_secondary_fraction: 0.15
    minimum_mode_separation_um: 4.0
    on_detected: stop
  center_boundary_tolerance_um: 0.5
  legacy_v2_v3_role: qa_only
  forbid_absolute_error_claim: true

# -----------------------------------------------------------------------------
# v5 主配准：多带宽积分阶跃四边对比 + 切向分块 bootstrap
# 冻结日期 2026-08-31；对全部样本统一运行。
# -----------------------------------------------------------------------------
registration_v5:
  method: multiband_integrated_step_contrast_bootstrap
  evidence_level: 3
  fixed: [theta_session_deg, d4_transform_session, nominal_size_um]
  optimize_only: [center_x_um, center_y_um]
  nominal_size_um: 200.0
  local_canvas_um: 270.0
  edge_search_halfwidth_um: 20.0
  center_grid_step_um: 0.25
  profile_strip_halfwidth_um: 70.0
  smoothing_sigma_um: 0.75
  contrast_bandwidths_um: [3.0, 5.0, 8.0, 12.0]
  boundary_gap_um: 0.75
  tangent_blocks: 8
  bootstrap_replicates_per_band: 64
  random_seed: 20260831
  evidence_normalization: outer_reference_height_mad
  joint_evidence:
    hard_minimum_total: 8.0
    review_below_total: 12.0
    hard_minimum_per_axis: 3.0
  uncertainty:
    ci_quantiles: [0.025, 0.975]
    review_ci_span_um: 6.0
    hard_ci_span_um: 12.0
    review_mad_um: 1.5
    hard_mad_um: 3.0
  multimodality:
    histogram_bin_um: 1.0
    minimum_secondary_fraction: 0.15
    minimum_mode_separation_um: 4.0
    on_detected: stop
  center_boundary_tolerance_um: 0.5
  prior_methods_role: qa_only
  forbid_absolute_error_claim: true

# -----------------------------------------------------------------------------
# v6 主配准：全物理可行初始化域 + 多带宽/切向块稳健共识
# 冻结日期 2026-08-31；v5 发现的固定 ±50 um 单槽先验截断在本版显式修正。
# -----------------------------------------------------------------------------
registration_v6:
  method: feasible_domain_multiband_block_consensus
  evidence_level: 3
  fixed: [theta_session_deg, d4_transform_session, nominal_size_um]
  optimize_only: [center_x_um, center_y_um]
  nominal_size_um: 200.0
  local_canvas_um: 340.0
  edge_search_halfwidth_um: 55.0
  center_grid_step_um: 0.25
  profile_strip_halfwidth_um: 70.0
  smoothing_sigma_um: 0.75
  contrast_bandwidths_um: [3.0, 5.0, 8.0, 12.0]
  boundary_gap_um: 0.75
  tangent_blocks: 8
  single_initializer_domain: full_physical_domain_with_115um_edge_evidence_margin
  paired_initializer_domain: frozen_nonoverlap_slot_domain
  aggregation: median_over_blocks_then_median_over_bandwidths
  uncertainty: delete_one_block_and_delete_one_bandwidth
  joint_evidence:
    hard_minimum_total: 8.0
    review_below_total: 12.0
    hard_minimum_per_axis: 3.0
  influence:
    ci_quantiles: [0.025, 0.975]
    review_ci_span_um: 6.0
    hard_ci_span_um: 12.0
    review_mad_um: 1.5
    hard_mad_um: 3.0
  multimodality:
    histogram_bin_um: 1.0
    minimum_secondary_fraction: 0.15
    minimum_mode_separation_um: 4.0
    on_detected: stop
  local_search_boundary_tolerance_um: 0.5
  global_search_boundary_tolerance_um: 0.5
  prior_methods_role: qa_only
  forbid_absolute_error_claim: true

# -----------------------------------------------------------------------------
# v7 主配准：v6 搜索/门禁不变；对边目标改为平衡几何合取
# 冻结日期 2026-08-31；对全部 200 样本统一运行。
# -----------------------------------------------------------------------------
registration_v7:
  method: feasible_domain_independent_side_constrained_consensus
  evidence_level: 3
  fixed: [theta_session_deg, d4_transform_session, nominal_size_um]
  optimize_only: [center_x_um, center_y_um]
  nominal_size_um: 200.0
  local_canvas_um: 340.0
  edge_search_halfwidth_um: 55.0
  center_grid_step_um: 0.25
  profile_strip_halfwidth_um: 70.0
  smoothing_sigma_um: 0.75
  contrast_bandwidths_um: [3.0, 5.0, 8.0, 12.0]
  boundary_gap_um: 0.75
  tangent_blocks: 8
  single_initializer_domain: full_physical_domain_with_115um_edge_evidence_margin
  paired_initializer_domain: frozen_nonoverlap_slot_domain
  aggregation: median_over_blocks_then_median_over_bandwidths
  opposing_edge_objective: independent_side_peaks_then_fixed_width_midpoint
  balanced_opposing_edges: true
  uncertainty: delete_one_block_and_delete_one_bandwidth
  joint_evidence:
    hard_minimum_total: 8.0
    review_below_total: 12.0
    hard_minimum_per_axis: 3.0
  influence:
    ci_quantiles: [0.025, 0.975]
    review_ci_span_um: 6.0
    hard_ci_span_um: 12.0
    review_mad_um: 1.5
    hard_mad_um: 3.0
  multimodality:
    histogram_bin_um: 1.0
    minimum_secondary_fraction: 0.15
    minimum_mode_separation_um: 4.0
    on_detected: stop
  local_search_boundary_tolerance_um: 0.5
  global_search_boundary_tolerance_um: 0.5
  prior_methods_role: qa_only
  forbid_absolute_error_claim: true

# -----------------------------------------------------------------------------
# 公共视场与 mask-aware 重采样 (WP9)
# -----------------------------------------------------------------------------
registered_canvas:
  preferred_size_um: [300.0, 300.0]
  minimum_size_um: [260.0, 260.0]
  fail_below_minimum: true
  forbid_extrapolation: true

  pixel_um: auto_not_finer_than_coarsest_input
  grid_rule: fit_integer_pixels
  # 解析方式：N = floor(L_reg / max_input_pixel_um)；pixel_um = L_reg / N
  # 例如 L_reg=300, max_input_pixel=0.344174 -> N=871, pixel_um=0.344431

resampling:
  interpolation: linear
  sensitivity_only_interpolations: [nearest, cubic]
  normalized_interpolation: true         # z' = I(zM) / I(M)
  minimum_mask_weight: 0.99
  maximum_gap_um: auto_multiple_of_input_pixel
  maximum_gap_multiple: 2.0
  forbid_extrapolation: true
  forbid_bridging_large_gaps: true
  require_mask_same_transform: true
  record_valid_fraction: true

# -----------------------------------------------------------------------------
# Final leveling (WP9)
# -----------------------------------------------------------------------------
final_leveling:
  reference_source: h_reg_outside_nominal_region   # 禁止使用 H_200
  exclusion_halfwidth_um: 120.0
  minimum_reference_frame_width_um: 10.0
  minimum_reference_valid_fraction: 0.20
  method: asymmetric_sigma_clip
  require_multi_quadrant_coverage: true
  robust_residual_check: true
  on_failure:
    final_leveling_failed: true
    registration_status: failed
    forbid_h_200_export: true
    forbid_h_stable_export: true

# -----------------------------------------------------------------------------
# CAG-CSV 等价证据 (WP3)
# -----------------------------------------------------------------------------
equivalence:
  fixtures_per_session_min: 3
  allowed_fixture_source_types:
    - keyence_official_export
  shallow_medium_deep_selection:
    order:
      - design_coverage                  # pass / frequency / velocity / hatch
      - contrast_diagnostics             # 不依赖单一阈值
    freeze_selection_before_comparison: true
    forbid_swap_after_seeing_error: true

  tolerance:
    shape_exact_match: true
    dx_dy_abs_um: 0.0000005
    height_rounding_um: 0.001
    height_rounding_rule: half_up
    report: [max_abs, median_abs, rmse]
    orientation:
      forbid: [transpose, flip, cyclic_roll]
      corner_check: true
      fixed_pixel_checks_min: 5

  mask_semantics:
    # All 160 measurements currently have zero CAG sentinel pixels.  In that
    # observed case an official CSV with a numeric value at every pixel is
    # sufficient to confirm the all-valid mask.  This exception never applies
    # when even one sentinel is present.
    allow_all_valid_case: true
    if_csv_has_no_mask:
      set_metadata: mask_source=unavailable
      forbid_fabricated_all_valid_mask: true
      decision: stop
      height_decision_may_pass_alone: true
    if_csv_fills_invalid:
      compare_height_on_cag_valid_pixels_only: true
      official_fill_values_purpose: format_compatibility_only
      production_mask_source: cag_raw_sentinel
      report_note: CSV cannot independently prove mask

# -----------------------------------------------------------------------------
# 四边污染距离 (WP11)
# -----------------------------------------------------------------------------
boundary:
  input_source: h_reg                    # 禁止从 H_200 估计
  depth_definition: D = z_reference - z

  profile:
    halfwidth_um: 60.0
    center_reference_halfwidth_um: 20.0
    smoothing: gaussian
    smoothing_sigma_um: 1.0
    estimator: median
    save_absolute: true
    save_normalized: true

  primary_criterion:
    name: gradient_mad_3x_persistence_5um
    gradient_sigma_threshold: 3.0
    minimum_persistence_um: 5.0
    search_direction: from_nominal_edge_inward
    stop_at: contamination_gone_and_stable
    forbid_single_spike_decision: true

  alternative_criterion:
    name: gradient_mad_5x_persistence_8um
    gradient_sigma_threshold: 5.0
    minimum_persistence_um: 8.0
    preregistered: true

  report: [margin_sensitivity_um]
  edges: [left, right, top, bottom]

# -----------------------------------------------------------------------------
# 统一 stable ROI (WP12)
# -----------------------------------------------------------------------------
stable_roi:
  primary_coverage_quantile: 0.90
  sensitivity_coverage_quantile: 0.95

  stratification:
    variables: [pulse_width, frequency, hatch, pass, velocity]
    minimum_strata_size: 8
    rule_if_sufficient: max_over_strata_q0.90
    rule_if_insufficient: overall_q0.90_with_uncertainty_report
    purpose: coverage_diagnosis_only     # 不作因果解释

  combination:
    m_x: max(m_left, m_right)
    m_y: max(m_top, m_bottom)
    roi_x: [-100 + m_x, 100 - m_x]
    roi_y: [-100 + m_y, 100 - m_y]

  rounding_um: 10.0
  rounding_rule: floor_conservative
  symmetric_about_origin: true
  shared_across_all_samples: true

  forbid:
    - use_q0.10_for_90pct_coverage
    - switch_quantile_after_seeing_results
    - per_sample_roi_shrink

invalid_protocol:
  recheck_after_roi_fixed: true
  on_residual_contamination:
    stable_roi_valid: false
    stable_features: missing
    forbid: [impute, local_repair, per_sample_shrink, silent_drop]
    keep_in: [registration_archive, boundary_archive, full_morphology_archive]
  report_missingness_by_process: true
  selection_bias_risk_threshold: 0.30   # 某层 invalid 比例超过此值须显式告警

# -----------------------------------------------------------------------------
# QA
# -----------------------------------------------------------------------------
qa:
  save_individual: true
  save_montage: true
  absolute_color_scale: global
  local_color_percentiles: [1.0, 99.0]
  local_contrast_watermark: LOCAL CONTRAST — NOT COMPARABLE IN ABSOLUTE DEPTH
  per_sample_required:
    - raw_height
    - coarse_leveled_height
    - raw_valid_mask
    - registered_valid_mask
    - nominal_100um_boundary
    - h_reg_boundary
    - h_200_boundary
    - center
    - theta_session_deg
    - d4_transform
    - region_score
    - edge_score
    - weight_sensitivity_shift_um
    - leveling_residual
    - warning_flags
    - status

# -----------------------------------------------------------------------------
# 硬门禁：失败即 STOP，不得降级为 warning
# -----------------------------------------------------------------------------
gates:
  phase0:
    require_decision: PASS
    require_blockers_empty: true
    require_sessions: 3
    require_measurements_total: 160
    require_samples_total: 200
    require_equivalence_all_sessions: true
    forbid_skip_hashes: true
    forbid_stale_manifest: true

  phaseA:
    require_manual_approval: true
    approval_file: outputs/rectangle_registration/PHASE_A_APPROVAL.md
    required_status: PASS
    forbid_script_self_approval: true
    auto_checks:
      - theta_unimodal_stable
      - d4_confirmed_by_evidence_or_human
      - l_reg_ge_260um
      - low_search_boundary_hit_rate
      - no_systematic_shallow_failure
      - four_edge_hard_failures_absent
      - four_edge_residuals_within_frozen_limits
      - final_leveling_reference_sufficient

  phaseB:
    require_manual_approval: true
    approval_file: outputs/rectangle_registration/PHASE_B_APPROVAL.md
    required_status: PASS
    forbid_script_self_approval: true
    require_both_rois_frozen: [0.90, 0.95]
    forbid_phaseB_feedback_into_phaseA: true

# -----------------------------------------------------------------------------
# 输出目录布局
# -----------------------------------------------------------------------------
output_layout:
  phase0: phase0
  equivalence: phase0/equivalence
  inventory: inventory
  calibration: calibration
  metrics: metrics
  transforms: transforms
  registered_h_reg: registered/H_reg
  registered_h_200: registered/H_200
  registered_masks: registered/masks
  boundary: boundary
  stable_roi: stable_roi
  stable_roi_masks: stable_roi/masks
  qa: qa
  run_manifest: run_manifest.json
