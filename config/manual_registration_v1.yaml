# =============================================================================
# manual_v1 人工四边配准 —— 冻结配置
# 上位规范 : 任务说明书/WORKBUDDY_下一阶段_人工四边配准与PhaseA重建计划.md (§3)
# 冻结日期 : 2026-08-31（在任何人工—算法比较开始之前冻结）
#
# 使用约定
#   1. 本文件在 WP1 冻结之后不得修改；确需修订时必须重新走 WP1 全量校验。
#   2. algorithm_manual_qa_bands_um 的 2/5 µm 仅用于标记一致性等级，
#      不是绝对误差阈值，也不得用于在不同自动版本之间事后选优。
#   3. 单人标注（annotator_a）为 Level 3 证据；人工—自动差异只能表述为
#      “一致性 / 偏移 / 分歧”，禁止使用“绝对误差”“精度真值”“ground truth”。
# =============================================================================

method: manual_four_edge_a_v1
evidence_level: 3
annotator: a
center_source: midpoint_of_four_manual_edges
nominal_box_um: [200.0, 200.0]

manual_geometry_gate:
  observed_width_um: [180.0, 220.0]
  observed_height_um: [180.0, 220.0]
  require_all_complete: true
  allow_unusable: false
  require_paired_order: true
  minimum_paired_center_separation_um: 300.0

algorithm_manual_qa_bands_um:
  close: 2.0
  moderate: 5.0
  large: 5.0

primary_automatic_comparator: v6
secondary_comparators: [v3, v4, v5, v7]
forbid_samplewise_fallback: true
forbid_absolute_error_language: true

# -----------------------------------------------------------------------------
# 冻结的输入合同（WP1 校验依据；数值来自计划 §1 的已核验基线）
# -----------------------------------------------------------------------------
source_annotation_table: outputs/rectangle_registration/registration/manual_four_edge_validation.csv
expected_source_sha256: 536BF658AD75F1BC7DCC6E9461D821E046F58A7636D26A7EAABF51A80D56AF9D
expected_rows: 200
expected_session_counts:
  zro2_120_formal: 120
  zro2_60_pass: 60
  zro2_20_supplement: 20
expected_annotator_a_complete: 200

# (u,v) -> (x,y) 反算与保存值的容差（µm）
canonical_identity_tolerance_um: 1.0e-6
