schema_version: 2
frozen_at_local: '2026-08-31'
authority: reviewer_feedback_on_manual_v1_phase_a_review
supersedes: config/phase_a_exclusions.yaml (schema_version 1, left untouched)
scope: manual_v1 only -- never applied to the legacy default pipeline
notes:
  - >-
    Reviewed 2026-08-31. The schema_version 1 entry for zro2_60_pass
    measurement 27 (samples 53, 54) is NOT carried over. Under manual_v1
    centres their available centred square is 338.65 um and 276.35 um,
    both at or above the 260 um minimum, so there is no basis for excluding
    them. They are re-included by this policy.
  - >-
    The zro2_20_supplement entry is kept, but it is now an explicit
    BLOCKER. With manual_v1 centres the session common centred square is
    198.38 um, below the 260 um registered-grid minimum. Excluding a whole
    session does not satisfy the all-200-samples acceptance gate; the
    session must be remeasured or the protocol formally amended.
policy:
  preserve_raw_and_diagnostic_outputs: true
  forbid_silent_drop: true
  exclusions_are_explicit_parameters: true
  exclude_from: [registered_exports, phase_a_analysis, phase_b_analysis]
exclusions:
  - session_id: zro2_20_supplement
    all_measurements: true
    all_samples: true
    reason: >-
      Paired acquisition layout provides only 198.38 um common centred FOV
      under manual_v1 centres (13 of 20 samples cannot support a full 200 um
      square without extrapolation), below the 260 um registered-grid
      minimum.
    disposition: remeasurement_required
    blocks_phase_a_acceptance: true
blockers:
  - id: BLK-1
    scope: zro2_20_supplement
    samples: 20
    statement: >-
      zro2_20_supplement cannot be exported with the registered grid, so 20
      of 200 samples fail the all-sample common-canvas and mask gates.
      Resolution requires remeasurement of the session or a formally amended
      acceptance criterion. Until then Phase A stays BLOCKED and must not be
      switched to PASS manually.
