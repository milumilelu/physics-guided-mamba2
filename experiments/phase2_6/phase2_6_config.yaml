# Phase 2.6 configuration -- frozen with Phase2.6_落地执行细则.md (FROZEN_EXECUTED).
# Every number below is preregistered BEFORE any formal run (细则 §0.14).
# Units: length um; tau fs; f kHz; v mm/s; N count; angles deg (image frame,
# +x = image right, +y = image down).

meta:
  description: "Phase 2.6 single-line scale tracing (single_line_manifest -> geometry -> width model -> scale bridge -> ratio test -> orientation NA)"
  random_seed: 20260904
  quick_output_root: outputs/phase2_6_quick
  rules_doc: experiments/phase2_6/Phase2.6_落地执行细则.md

paths:
  line_cag: "氧化锆/120组直线.cag"
  line_design_csv: "氧化锆/氧化锆_line_design.csv"   # gb18030 encoded
  line_view_manifest: "annotations/single_line_view_manifest.csv"
  phase2_manifest: "outputs/phase2/manifest/phase2_manifest.csv"
  p25_spectral_csv: "outputs/phase2_5/spectral_composition/spectral_composition.csv"
  p25_ilr_csv: "outputs/phase2_5/spectral_composition/ilr_coordinates.csv"
  p25_directional_csv: "outputs/phase2_5/directional_spectrum/directional_metrics.csv"
  p25_radial_long_csv: "outputs/phase2_5/spectral_composition/radial_spectrum_long.csv"
  p25_descriptor_csv: "outputs/phase2_5/spectral_composition/spectrum_descriptor_summary.csv"
  p25_cv_fold_csv: "outputs/phase2_5/process_map/cv_fold_results.csv"
  pilot_protocol: "outputs/zro2_single_line_pilot/pilot_protocol.json"
  pilot_longitudinal_csv: "outputs/zro2_single_line_pilot_cut_only_stable_region/pilot_longitudinal_profiles.csv"
  pilot_features_csv: "outputs/zro2_single_line_pilot/pilot_single_line_features.csv"

single_line:
  session_id: zro2_120_line
  pixel_um: 0.278657          # asserted against the CAG container head (x/y pitch)
  z_step_um: 0.0001
  power_w: 5.333              # pilot protocol + 现有数据基础说明_v2 §11
  power_source_note: "measured post-objective 5.3333 W, no independent record (v2 §11); rectangle side carries the same value with PENDING_REGISTRATION"
  plane_source: view_manifest_frozen   # coefficients frozen by scripts/33; NEVER refit here
  rotate_order: 1             # profile sampling interpolation order (axis-sampled, no whole-map rotation)
  mask_weight_min: 0.99       # normalized interpolation weight threshold (same as src/resampling)
  detection_threshold_k: 4.0  # groove threshold = k * sigma_ref_um  (pilot: D > k*1.4826*MAD)
  min_profile_points: 8       # valid pixels above threshold required to call a position on-line
  min_extent_run_um: 3.0      # minimum consecutive on-line fine positions to accept a line body
  extent_merge_gap_um: 5.0    # on-line runs separated by <= this gap are merged
  fine_step_um: 1.0           # detection scan step (matches pilot longitudinal step)
  stable_region:              # §0.15 rev2 refinement: depth-plateau longest run
    mode: depth_plateau_longest_run
    depth_frac: 0.50          # depth_p95 >= 0.50 * P90(depth_p95 | on-line)
    ref_quantile: 0.90        # robust plateau depth (median is pulled down by ramps)
    width_band_frac: null     # REVOKED (2026-09-04): brittle at scale (fragmented dozens of lines
                              # via cone-split run oscillation); group-104 deep-narrow divergence stays
                              # an informational inventory item instead. depth rule + fragment guard only.
    gap_merge_um: 5.0         # bridge small dropouts (2-point failures make 3 um gaps); larger violations block merging
    min_stable_len_um: 60.0   # fragment guard (group-48 lesson): chosen run must hold
    min_stable_frac: 0.50     # >= max(60 um, 0.5 x on-line span), else FragmentedStableRegion -> insufficient_sections + human QA
  central_fraction_note: "original frozen central 70% (pilot central_fraction=0.7) superseded by the plateau rule; pilot interior depth oscillation (e.g. group 94: 5.9-11 um vs plateau 10.8) passes by design"
  cross_section_step_um: 2.0
  min_sections: 20
  censored_frac_W50_uncertain_above: 0.5
  profile_valid_fraction_min: 0.5   # section usable if >= 50% of the lateral samples are in-FOV
  pilot_reconcile_max_shallow_invaded_per_group: 5   # SAFE-direction abort (细则 §0.15 rev2 补注 (b)):
  pilot_reconcile_max_shallow_invaded_total: 20      # my stable region must not retain shallow partial-ablation
                                                     # segments the pilot excluded (per-group and 15-group total caps);
                                                     # precision/recall/agreement are informational divergence
                                                     # inventory (pilot cut is not locally reconstructible);
                                                     # insufficient_sections lines are skipped (no meaningful flags)
  pilot_reconcile_match_tol_um: 1.5
  pilot_reconcile_max_shift_um: 30.0   # cross-correlation alignment before matching (origin conventions differ)

widths:
  thresholds_q: [0.2, 0.5, 0.8]
  primary: W50
  weq_from_positive_part: true
  affected_delta_um: 0.10     # effective delta = max(this, 3*plane_rmse_um); secondary descriptor only
  height_arm_primary: raw     # repaired = sensitivity; extent/sections frozen from raw arm
  identifiability_states: [estimable, right_censored, insufficient_sections]

cone_repair:                  # sensitivity arm only; pilot-parameter mapping, 细则 §0.5 rev2 补注
  seed_sigma: 6.0             # pilot cone_seed_sigma
  grow_sigma: 1.5             # pilot cone_grow_sigma
  minimum_seed_depth_um: 0.8  # pilot cone_min_seed_depth_um
  maximum_span_um: 10.0       # pilot cone_max_component_span_px=36 * 0.278657 = 10.03 um
  background_radius_um: 4.0   # current module default (deleted pilot path used a half-window instead)
  boundary_protection_um: 1.0 # FOV-adapted override: module default 5.0 was designed for the 80 um ROI
  ring_width_um: 3.0
  minimum_grow_depth_um: 0.35
  minimum_pixels: 3
  maximum_aspect_ratio: 2.8
  minimum_bbox_fill: 0.12

qa_montage:                   # BLIND: no 8/16 um reference lines, no band shading, no bridge results
  panels: [absolute_height, corrected_depth_field, representative_cross_section_widths,
           depth_and_weq_curves, W50_section_distribution_blind, mask_and_censoring]
  dpi: 110

lambda_star:
  window_um: [4.0, 32.0]      # half-open [4, 32) on bin lambda_geo_um
  min_band_energy_fraction: 0.10   # guard: window energy / total non-DC energy
  sensitivity: [peak_4_32_drop_low_mode, global_centroid]
  peak_n_modes_min: 20
  peak_min_energy_share_in_window: 0.20

bridge:
  box: {tau_fs: [223, 4000], f_khz: [2, 40], v_mm_s: [5, 25], pass: [1, 5]}   # closed intervals; frozen coverage 101/200
  coverage_states: [exact_match, in_box_pred, out_of_box]
  direct_bridge:
    condition_aggregation: mean_lambda_star_within_condition
    report_spread_for_repeats: true

model_compare:
  targets_scalar_r2: [p_8_16, ilr_z2, A2_8_16, angular_entropy_8_16, lambda_star_4_32]
  targets_multivariate: [ilr_z1_z4]          # Aitchison Q2 ONLY on the full composition (细则 §0.13 rev2)
  aitchison_scope: full_composition_only
  models:
    M0: "Y ~ u"                              # raw process [tau, f, h, N, v]
    M0b: "Y ~ [u, log10_tau]"                # transform control (contains the full W_hat basis)
    M1: "Y ~ [u, W_hat]"                     # LOW-CAPACITY REPRESENTATION GAIN only -- NOT mechanism evidence
    M2: "Y ~ h"
    M3: "Y ~ [u, W_hat, W_over_h]"
    M_GEO: "Y ~ [W_hat, h, W_over_h]"        # geometry-compression arm (G-SL3 primary)
  models_primary: Ridge
  sensitivity: [spline, extratrees, exclude_artifact, minus_top5, full200_extrapolated, usable_only_W_model]
  alpha_grid_logspace: [-3, 3, 13]
  retention:                    # G-SL3 = Geometry-compression Gate (frozen; 细则 §0.13 rev2)
    m0_min_perf: 0.10           # retention defined only where M0 median CVperf >= this
    supported_min: 0.80
    strong_tier: 0.90
    min_folds_above: 0.60
    min_folds_positive: 4
    proc_agreement_min: 0.70    # proc_gkf retention below this -> PARTIAL
  m0_recon_full200_tolerance: 0.005   # M0_RECON_FULL200 QA vs phase2_5 cv_fold_results (§0.16)

ratio_test:
  d_int_tolerance: 0.25
  a_obs_min: 0.40
  n_perm: 10000
  shuffle_unit: [session_id, base_condition_group]   # verified: formal 120 row-units, pass 15 bases, supplement 10 bases
  h2_primary_stat: lambda_peak_4_32  # H2 periodicity uses the peak, not the centroid (细则 §0.18 rev2)
  h2_sensitivity_stat: lambda_star_4_32
  valid_fraction_peak_min: 0.5      # G-SL2 capped at PARTIAL below this

gates:
  gsl1:
    band_um: [8.0, 16.0]
    population: estimable_only
    min_line_fraction: 0.50
    weq_same_direction: true
    repaired_divergence_note_above: 0.10
    min_estimable_for_supported: 60
  gsl2: {a_obs_min: 0.40, p_max: 0.05}
  gsl3: see model_compare.retention
  gsl4: {provenance_valid: false}    # v2 §12: serpentine fill, no per-sample axis; NA path (§0.8)

orientation:
  image_frame_cluster_deg: 10.0        # descriptive only, never scan-alignment evidence

seeds:
  gss_src_offset: 100
  gss_proc_offset: 200
  extratrees_offset: 700
  permutation_offset: 800
