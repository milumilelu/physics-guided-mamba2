meta:
  random_seed: 20260904
  quick_output_root: outputs/phase2_8_quick
  formal_output_root: outputs/phase2_8

paths:
  exploration_manifest: outputs/phase1_minimal/exploration_manifest.csv
  dataset_npz: outputs/rectangle_registration/manual_internal_roi_v1/dataset/stable_roi_80um_dataset.npz
  raw_height_dir: outputs/rectangle_registration/manual_internal_roi_v1/registered/H_stable_raw
  phase2_manifest: outputs/phase2/manifest/phase2_manifest.csv
  ilr_csv: outputs/phase2_5/spectral_composition/ilr_coordinates.csv
  directional_csv: outputs/phase2_5/directional_spectrum/directional_metrics.csv
  phase2_6_config: experiments/phase2_6/phase2_6_config.yaml

# ------------------------------------------------------------------ #
# Task 24 (2.8A) -- hierarchical information channels
# ------------------------------------------------------------------ #
task24:
  targets:
    D:        {source: manifest, column: median_depth_um, type: scalar}
    A:        {source: manifest, column: residual_Sq_um, type: scalar,
               parity_vs_residual_sq: true}
    Pl:       {source: ilr_csv, columns: [ilr_z1, ilr_z2, ilr_z3, ilr_z4],
               type: composition}
    Ot_A2:    {source: directional_csv, column: A2, band: "8_16", type: scalar}
    Ot_ent:   {source: directional_csv, column: angular_entropy, band: "8_16",
               type: scalar}
  sensitivity_band: "16_32"
  joint_secondary:
    columns: [A2_8_16, angular_entropy_8_16]
    standardize: fold_internal_train
    type: multi_secondary
  models:
    full:    [pulse_duration_fs, frequency_kHz, hatch_spacing_um, pass_count, velocity_mm_s]
    h_only:  [hatch_spacing_um]
    minus_h: [pulse_duration_fs, frequency_kHz, pass_count, velocity_mm_s]
  ridge: {alpha_grid_logspace: [-3, 3, 13], inner_splits: 5, outer_splits: 5}
  folds:
    src_gkf:  {groups: shared_height_source_id, splitter: GroupKFold}
    proc_gkf: {groups: cv_process_group, splitter: GroupKFold}
    # deterministic GroupKFold both; shuffle variant only as
    # proc_gss_sensitivity (v2.1 F1), not part of the primary protocol
  populations:
    primary: common_intersection          # expected 200/200; n registered
    in_box: {from: phase2_6_config, key: bridge.box}   # frozen 101/200
    raw_repaired: {fields_from: raw_height_dir, fallback: register_NA}
  dummy_tolerance: 1.0e-9

  realization_diagnostic:
    phase_only_eps: 1.0e-12
    max_shift_px: 4
    trim_px: 4               # corr computed on the trimmed center crop
    n_random_pairs: 2000
    seed_offset: 400
    pair_types: [same_condition_key, exact_repeat_u, random_ordinary]
  raw_recompute:
    pixel_um: 0.5
    directional_theta_bins: 18
    bands: [[8.0, 16.0, "8_16"], [16.0, 32.0, "16_32"],
            [32.0, 64.0, "32_64"], [64.0, null, "64_inf"]]

seeds:
  diagnostic_pairs: 20261304   # meta + 400
