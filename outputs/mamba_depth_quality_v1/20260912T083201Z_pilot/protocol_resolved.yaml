schema: mamba_depth_quality_v1
spec_version: '1.0'
status: PROPOSED_NOT_EXECUTED
note: Configuration template; implement a validating loader before execution. This is not an existing repository
  command.
source_anchor:
  repository: milumilelu/physics-guided-mamba2
  commit: f824c18439c8c79ca643c7fe13632f3047fcfae1
scope:
  existing_samples_only: true
  new_experiments_required: false
  main_learning_model: Mamba-2
  default_route: A_reference_sequence_terminal_proxy
  deep_training_allowed: true
  permission_scope: new_namespace_only_after_own_G0_G1_G2_checks
  modify_old_protocol_permissions: false
  release_other_workflow_holds: false
  automatic_push: false
  default_profile: pilot
paths:
  new_config_dir: config/mamba_depth_quality_v1
  new_source_dir: src/mamba_depth_quality
  new_experiment_dir: experiments/mamba_depth_quality_v1
  new_test_dir: tests/mamba_depth_quality_v1
  output_root: outputs/mamba_depth_quality_v1
  audit_run: outputs/task_state_v1/20260906T111435Z_E00_a1a1c9a8_533009c_9e0686
  height_package: outputs/rectangle_registration/manual_internal_roi_v1/dataset/stable_roi_80um_dataset.npz
  expected_height_sha256: 8a116fe28f1239506ee1f0c409132ca805569e256abffb049c4cb51d4c9b9423
data:
  cohort: MAIN180
  expected_rows: 180
  expected_components: 126
  identity:
  - session_id
  - sample_id
  grouping: existing_source_and_process_family_connected_components
  outer_folds: 5
  inner_folds: 3
  reuse_frozen_partitions: true
  SUPP20:
    default_access: excluded_from_training_and_selection
    evaluate_in_pilot: false
    future_track: family_purged_domain_stress_only
  height_source: height_raw
  pixel_um: 0.5
  roi_shape:
  - 160
  - 160
  process_columns:
  - pulse_duration_fs
  - frequency_kHz
  - velocity_mm_s
  - hatch_spacing_um
  - pass_count
  power_source: verified_repository_power_registry
  optical_geometry_source: frozen_repository_nominal_optical_registry
  unknown_metadata_policy: mark_unknown_do_not_invent
targets:
  primary:
  - id: D
    definition: negative_valid_median_external_plane_referenced_height
    unit: um
  - id: Sq
    definition: rms_about_valid_mean_height_no_extra_spatial_filter
    unit: um
  auxiliary:
  - ilr_z1
  - ilr_z2
  A_med_is_not_Sq: true
  target_transform: training_component_weighted_standardization_for_loss
  no_measured_morphology_in_inference: true
reference:
  id: RLOG_EQEXP_v1
  interpretation: proposed_gaussian_equivalent_average_exposure_closure_not_pulse_resolved_truth
  not_equivalent_to_historical_P00: true
  unit_system: SI_internal_um_output
  equations:
    Ep: P/f
    F0: 2*Ep/(pi*w0**2)
    Aeq: pi*w0**2/2
    nu_per_pass: f*Aeq/(v*h)
    nu_total: N*nu_per_pass
    dose_identity: F0*nu_total=P*N/(v*h)
    D0_m: delta_m*nu*max(log(F0/F1),0)
  quality_prediction: NOT_MODELED
  fit_parameters:
  - F1_J_per_m2
  - delta_m
  freeze_optical_parameters: true
  calibration:
    method: deterministic_threshold_grid_and_weighted_nonnegative_delta
    F1_grid_size: 64
    F1_min_multiplier_train_min_F0: 0.01
    F1_max_multiplier_train_max_F0: 0.95
    grid_is_computational_guard_not_material_prior: true
    selection: training_component_balanced_MSE_D
    train_reference_crossfit_splits: 3
    refit_inside_every_inner_fold_and_learning_curve_subset: true
    evaluation_reference: fit_on_corresponding_training_partition_only
    save_profile_and_boundary_flags: true
tokenization:
  id: equivalent_exposure_progress_v1
  points_per_pass: 8
  length_rule: 8*pass_count
  interpretation: quadrature_like_exposure_progress_not_observed_time
  physical_pulse_splitting: false
  features:
  - log_tau
  - log_f
  - log_v
  - log_h
  - pass_index
  - within_pass_progress
  - log1p_nu_start
  - log1p_nu_end
  - log1p_delta_nu
  - log_Ep_SI
  - log_F0_SI
  - log_dx_over_2w
  - log_h_over_2w
  - log_F0_over_F1
  - D_ref_start_um
  - D_ref_end_um
  raw_ablation_remove:
  - log_F0_over_F1
  - D_ref_start_um
  - D_ref_end_um
  normalization: fit_train_only_component_and_specimen_balanced_tokens
  terminal_readout: last_valid_token
  state_reset: every_independent_sample
  padding_changes_state: false
  forbidden_inputs:
  - measured_D
  - measured_Sq
  - measured_morphology
  - absolute_height
  - identifiers
  - session_id
  - heldout_fitted_parameters
mamba:
  backend: reference_pure_torch_ssd_mamba2_verified_adapter
  layers: 1
  d_model: 32
  expand: 2
  head_dim: 16
  d_state: 8
  n_groups: 1
  d_conv: 4
  chunk_size: 32
  pretrained_language_weights: false
  default_bottleneck_dim: 4
  heads_read_only_bottleneck: true
  learned_internal_dt_is_physical_time: false
heads:
  depth: D_base+3*s_D*tanh(head_D(z))
  depth_base_with_reference: D_ref_terminal
  depth_base_without_reference: training_weighted_mean_D
  depth_head_last_layer_zero_init: true
  posthoc_depth_clipping: false
  report_negative_depth_and_bound_saturation: true
  quality: s_Q*softplus(head_Q(z))
  quality_initial_prediction: training_weighted_mean_Q
  auxiliary: two_linear_standardized_spectral_outputs
  compression_claim: conditional_terminal_interface_only_not_total_physical_memory
models:
- id: CONST_DQ
  encoder: constant
  reference: false
  k: null
  aux_weight: 0.0
- id: TREE_U_DQ
  encoder: extra_trees
  reference: false
  k: null
  aux_weight: 0.0
- id: STATIC_PHY_K4_AUX
  encoder: static_mlp
  reference: true
  k: 4
  aux_weight: 0.1
- id: GRU_PHY_K4_AUX
  encoder: gru
  reference: true
  k: 4
  aux_weight: 0.1
- id: MAMBA_RAW_K4_AUX
  encoder: mamba2
  reference: false
  k: 4
  aux_weight: 0.1
- id: MAMBA_PHY_K4_NOAUX
  encoder: mamba2
  reference: true
  k: 4
  aux_weight: 0.0
- id: MAMBA_PHY_K4_AUX
  encoder: mamba2
  reference: true
  k: 4
  aux_weight: 0.1
- id: MAMBA_PHY_K32_AUX
  encoder: mamba2
  reference: true
  k: 32
  aux_weight: 0.1
tree:
  n_estimators: 300
  min_samples_leaf: 3
  max_features: 1.0
  n_jobs: 1
  fit_D_and_Q_separately: true
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 16
  max_epochs: 300
  min_epochs_before_stop: 30
  patience: 30
  gradient_clip_norm: 1.0
  amp: false
  reference_dtype: float64
  network_dtype: float32
  loss: 0.5*weighted_MSE_D_scaled+0.5*weighted_MSE_Sq_scaled+lambda_aux*mean_aux_weighted_MSE_scaled
  sample_weight: 1/(n_components*rows_in_component)
  mini_batch_weight_multiplier: n_training_rows*sample_weight
  early_stopping_metric: 0.5*MAE_D/s_D_train+0.5*MAE_Sq/s_Sq_train
  inner_seed: 17
  outer_epochs: median_of_inner_best_epochs
  outer_test_early_stopping: false
  hyperparameter_search: none_fixed_initial_configuration
profiles:
  pilot:
    outer_seeds:
    - 17
    models: all_eight
    learning_curves: false
    route_B: false
  expanded:
    outer_seeds:
    - 17
    - 29
    - 43
    extra_bottleneck_dims:
    - 2
    - 8
    learning_curve_fractions:
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    learning_curve_subset_seeds:
    - 101
    - 211
    - 307
    learning_curve_models:
    - TREE_U_DQ
    - STATIC_PHY_K4_AUX
    - MAMBA_PHY_K4_AUX
    nested_component_subsets: true
    refit_everything_within_subset: true
evaluation:
  primary_metrics:
  - component_balanced_MAE_D_um
  - component_balanced_MAE_Sq_um
  secondary_metrics:
  - RMSE_D_um
  - RMSE_Sq_um
  - OOF_train_mean_Q2_D
  - OOF_train_mean_Q2_Sq
  main_model: MAMBA_PHY_K4_AUX
  comparators:
  - TREE_U_DQ
  - STATIC_PHY_K4_AUX
  - GRU_PHY_K4_AUX
  - MAMBA_RAW_K4_AUX
  - MAMBA_PHY_K4_NOAUX
  - MAMBA_PHY_K32_AUX
  delta_sign: risk(comparator)-risk(main); positive_favors_main
  bootstrap:
    unit: component
    stratify_by: outer_fold
    replicates: 5000
    seed: 20260912
    level: 0.95
    scope: fixed_OOF_descriptive_conditional_not_full_refit
  noninferiority_tolerance_um:
    D: null
    Sq: null
  equivalence_claim_without_tolerance: false
  pilot_is_independent_confirmation: false
gates:
  G0: identities_hashes_targets_frozen_groups_permissions
  G1: reference_units_fit_provenance_token_contract_padding
  G2: mamba_numeric_parity_gradients_state_isolation_no_target_input
  G3: OOF_coverage_reload_all_files_sealed_clean_checkout
  mamba_parity_tolerance:
    float64_atol: 1.0e-08
    float64_rtol: 1.0e-08
    float32_atol: 1.0e-05
    float32_rtol: 1.0e-05
  historical_E03_full_pass_required_for_route_A: false
optional_extensions:
  route_B_bounded_threshold_closure:
    enabled: false
    closure_bound_log: 0.6931471805599453
    requires_own_discrete_physics_and_observer_tests: true
  mechanism_selection:
    enabled: false
    mode: training_side_global_structure_selection_first
  causal_response_compression:
    enabled: false
    claims: model_conditional_unless_effect_identified_from_existing_design
  synthetic_pretraining: false
release:
  new_run_only: true
  text_encoding: UTF-8
  newlines: LF
  byte_exact_new_seal: true
  preserve_old_artifacts: true
  legacy_EOL_compatibility: explicit_legacy_only
  include_tests_log: true
  snapshot_actual_shared_dependencies: true
  clean_checkout_import_and_reload_required: true
